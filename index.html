<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Persua · Ton diagnostic de vente complet</title>
<script>if(window.top!==window.self){try{window.top.location.replace(window.location.href);}catch(e){}}</script>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/toy/dossiers.webp">
<style>
:root{ --indigo:#544AFA; --electric:#4747FD; --accent:#8B83FF; --deep:#13133A; --ink:#0A0A14; --pearl:#F4F2F8; --white:#FFFFFF; --mist:#A7A2C6; --orange:#F7931E; --radius:16px; --wa:#25D366; --err:#FF8A8A;
  --display:'Archivo Black','Arial Black',system-ui,sans-serif; --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'General Sans',system-ui,-apple-system,sans-serif; background-color:var(--deep);
  background-image:radial-gradient(55vw 55vw at 80% -5%, rgba(84,74,250,.22), rgba(19,19,58,0) 60%),radial-gradient(50vw 50vw at 10% 30%, rgba(71,71,253,.10), rgba(19,19,58,0) 55%);
  background-attachment:fixed; color:var(--pearl); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100svh}
.wrap{max-width:640px; margin:0 auto; padding:0 18px}
h1,h2,h3{font-weight:700; letter-spacing:-.01em; color:var(--white); line-height:1.12}
.ink{color:var(--indigo)}

/* Barre de progression en segments + retour */
.pbar-shell{position:sticky; top:0; z-index:5; background:rgba(19,19,58,.94); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid rgba(84,74,250,.25); padding:10px 0; padding-top:calc(10px + env(safe-area-inset-top,0px)); display:none}
.pbar-shell.on{display:block}
.pbar-row{display:flex; align-items:center; gap:12px}
.back{flex:none; width:44px; height:44px; border-radius:14px; border:1px solid rgba(139,131,255,.28); background:rgba(10,10,30,.5); color:#fff; font-size:18px; font-family:inherit; cursor:pointer; display:grid; place-items:center}
.back[disabled]{opacity:.3; cursor:default}
.back.hide{visibility:hidden}
.pbar-main{flex:1; min-width:0}
.pbar-lbl{display:flex; justify-content:space-between; gap:10px; margin-bottom:6px; font-size:12.5px; font-weight:600; color:var(--mist)}
.pbar-lbl b{color:#fff; font-variant-numeric:tabular-nums; white-space:nowrap}
.segs{display:flex; gap:4px}
.segs i{flex:1; height:6px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; position:relative}
.segs i::after{content:""; position:absolute; inset:0; background:linear-gradient(90deg,var(--electric),var(--accent)); transform:scaleX(0); transform-origin:left; transition:transform .5s var(--spring)}
.segs i.on::after{transform:scaleX(1)}

.top{text-align:center; padding:26px 0 2px}
.top .kicker{color:var(--mist); font-weight:600; font-size:12px; letter-spacing:.16em; text-transform:uppercase}
.card{background:rgba(19,19,58,.72); border:1px solid rgba(84,74,250,.30); border-radius:24px; padding:26px 20px; box-shadow:0 24px 60px rgba(0,0,0,.5); margin:16px auto 0}
.card.flow{background:none; border:0; box-shadow:none; padding:8px 0 0}
#card{min-height:calc(100vh - 80px); min-height:calc(100svh - 80px)} /* réserve la place : le pied de page ne saute plus quand le quiz s'affiche (CLS) */
.enter{animation:enter .45s var(--ease) both}
@keyframes enter{from{opacity:0; transform:translateX(36px)}to{opacity:1; transform:none}}
.leave{animation:leave .24s ease-in both}
@keyframes leave{to{opacity:0; transform:translateX(-36px)}}

/* Objets 3D et leurs gestes (un par profil) */
.ob{position:relative; display:block}
.ob img{display:block; width:100%; height:auto; filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}
.a-F img{animation:zap 2.4s ease-in-out infinite}
@keyframes zap{0%,62%,100%{transform:none; filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}66%{transform:rotate(-7deg) scale(1.1); filter:drop-shadow(0 0 18px rgba(247,147,30,.95)) brightness(1.25)}70%{transform:rotate(6deg) scale(1.04)}74%{transform:rotate(-4deg) scale(1.12); filter:drop-shadow(0 0 26px rgba(255,200,90,1)) brightness(1.35)}80%{transform:rotate(2deg)}}
.a-F::before,.a-F::after{content:""; position:absolute; width:8px; height:8px; border-radius:50%; background:#FFD27A; box-shadow:0 0 10px #F7931E; opacity:0; animation:spark 2.4s ease-out infinite}
.a-F::before{left:10%; top:30%; --sx:-22px; --sy:-18px}.a-F::after{right:8%; top:58%; --sx:24px; --sy:-10px; animation-delay:.08s}
@keyframes spark{0%,64%{opacity:0; transform:none}68%{opacity:1}86%{opacity:0; transform:translate(var(--sx),var(--sy)) scale(.4)}100%{opacity:0}}
.a-E img{transform-origin:50% 100%; animation:wobble 3s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:none}20%{transform:skewX(-4deg) rotate(-2deg)}40%{transform:skewX(3deg) rotate(2deg)}55%{transform:translateY(-6px)}62%{transform:none}}
.a-E .fly{position:absolute; left:46%; top:6%; width:30%; height:22%; border-radius:6px; background:linear-gradient(180deg,#fff,#E6E3FF); box-shadow:0 4px 10px rgba(0,0,0,.3); opacity:0; animation:fly 3s ease-out infinite}
@keyframes fly{0%,50%{opacity:0; transform:none}56%{opacity:1}100%{opacity:0; transform:translate(70%,-140%) rotate(70deg)}}
.a-R img{transform-origin:40% 60%; animation:shake 2.6s ease-in-out infinite}
@keyframes shake{0%,55%,100%{transform:none}62%{transform:translateY(-9px) rotate(-4deg)}69%{transform:translateY(5px) rotate(3deg)}76%{transform:translateY(-7px) rotate(-3deg)}83%{transform:translateY(3px) rotate(2deg)}90%{transform:none}}
.a-C img{transform-origin:50% 90%; animation:camo 6s ease-in-out infinite}
@keyframes camo{0%,100%{filter:drop-shadow(0 12px 16px rgba(0,0,0,.45)) hue-rotate(0deg); transform:none}30%{filter:drop-shadow(0 12px 16px rgba(0,0,0,.45)) hue-rotate(75deg) saturate(1.3); transform:scale(1.03,.97)}55%{filter:drop-shadow(0 12px 16px rgba(0,0,0,.45)) hue-rotate(-60deg); transform:rotate(-3deg)}75%{filter:drop-shadow(0 12px 16px rgba(0,0,0,.45)) hue-rotate(160deg) saturate(1.2); opacity:.82}}

/* Intro */
.intro{text-align:center}
.orbit{position:relative; height:138px; margin:0 auto 14px; max-width:420px}
.orbit .ob{position:absolute; width:22%; animation:pop .7s var(--spring) both, float 4.5s ease-in-out infinite; animation-delay:var(--d), calc(var(--d) + .7s)}
@keyframes pop{from{opacity:0; transform:scale(.2) translateY(30px)}to{opacity:1; transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-10px) rotate(calc(var(--r) * -1))}}
.intro h1{font-family:var(--display); font-weight:400; font-size:clamp(32px,7.5vw,46px); line-height:1.02; margin-bottom:12px; text-wrap:balance}
.intro h1 .hl{background:var(--indigo); padding:0 .1em; border-radius:.1em}
.intro h1 .nw{white-space:nowrap}
.intro .lead{color:var(--pearl); font-size:16.5px; max-width:460px; margin:0 auto 18px}
.tcards{display:grid; gap:10px; max-width:460px; margin:0 auto; text-align:left}
.tcard{display:flex; gap:12px; align-items:center; background:rgba(24,24,74,.8); border:1px solid rgba(139,131,255,.24); border-radius:18px; padding:11px 13px}
.tcard .ob{width:46px; flex:none}
.tcard .k{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent)}
.tcard .k.free{color:var(--wa)}
.tcard b{display:block; color:#fff; font-size:15.5px; line-height:1.3}
.tcard span{font-size:13.5px; color:var(--mist); line-height:1.35}
.cta-dock{position:sticky; bottom:0; margin:18px -18px 0; padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px)); background:linear-gradient(180deg,rgba(19,19,58,0),rgba(19,19,58,.96) 32%)}
.micro{margin-top:8px; text-align:center; font-size:12.5px; color:var(--mist)}

/* Questions */
.dim-tag{display:inline-block; font-weight:700; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:8px}
.qtext{font-family:var(--display); font-weight:400; font-size:clamp(21px,5.6vw,26px); color:#fff; margin-bottom:18px; line-height:1.14; text-wrap:balance}
.qtext.long{font-size:clamp(19px,4.8vw,22px)}
.opts{display:grid; gap:10px}
.opt{position:relative; display:flex; gap:12px; align-items:center; width:100%; min-height:60px; text-align:left; background:rgba(24,24,74,.85); border:1.5px solid rgba(139,131,255,.22); border-radius:16px; padding:12px 14px; color:var(--pearl); font-family:inherit; font-size:15.5px; font-weight:500; line-height:1.38; cursor:pointer; overflow:hidden; -webkit-tap-highlight-color:transparent; transition:transform .3s var(--spring), border-color .2s, background .2s, box-shadow .2s}
.opt:hover{border-color:rgba(139,131,255,.55)}
.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.opt .letter{flex:none; width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:rgba(84,74,250,.2); color:var(--accent); font-size:13px; font-weight:700; transition:background .2s, color .2s}
.opt .tick{margin-left:auto; flex:none; width:24px; height:24px; border-radius:50%; background:var(--indigo); display:grid; place-items:center; transform:scale(0); transition:transform .35s var(--spring)}
.opt.sel{border-color:var(--indigo); background:linear-gradient(180deg,rgba(84,74,250,.32),rgba(84,74,250,.18)); color:#fff; transform:scale(1.02); box-shadow:0 0 0 4px rgba(84,74,250,.18),0 10px 26px rgba(84,74,250,.35)}
.opt.sel .letter{background:var(--indigo); color:#fff}
.opt.sel .tick{transform:scale(1)}
.ripple{position:absolute; width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.4); transform:translate(-50%,-50%) scale(0); pointer-events:none; animation:ripple .55s ease-out forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(28); opacity:0}}
.hint{margin-top:12px; color:var(--mist); font-size:13px; text-align:center}

/* Révélations */
.chip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; background:rgba(84,74,250,.18); border:1px solid rgba(84,74,250,.4); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--pearl)}
.chip.solid{background:var(--indigo); border-color:var(--indigo); color:#fff}
.reveal{text-align:center}
.drop{position:relative; height:176px; margin:8px 0 0}
.drop .ob{position:absolute; left:50%; top:6px; width:156px; margin-left:-78px; animation:drop .9s cubic-bezier(.3,0,.2,1) both .15s}
@keyframes drop{0%{transform:translateY(-260px) rotate(-14deg)}60%{transform:translateY(0) scale(1.08,.86)}75%{transform:translateY(-16px) scale(.96,1.04)}100%{transform:none}}
.drop .ring{position:absolute; left:50%; bottom:6px; width:60px; height:16px; margin-left:-30px; border-radius:50%; border:3px solid var(--accent); opacity:0; animation:ring .7s ease-out .7s}
@keyframes ring{0%{opacity:1; transform:scale(.4)}100%{opacity:0; transform:scale(4.5)}}
.cap-h{font-family:var(--display); font-weight:400; font-size:clamp(24px,6.4vw,32px); line-height:1.06; margin-bottom:8px; text-wrap:balance}
.reveal .cap-h .w{display:inline-block; animation:word .5s var(--ease) both; animation-delay:calc(.9s + var(--i) * .08s)}
@keyframes word{from{opacity:0; transform:translateY(14px); filter:blur(6px)}to{opacity:1; transform:none; filter:none}}
.reveal .desc{color:var(--pearl); font-size:16px; margin:0 0 14px; animation:word .5s var(--ease) both 1.4s}
.trap{text-align:left; background:linear-gradient(180deg,rgba(247,147,30,.16),rgba(247,147,30,.06)); border:1px solid rgba(247,147,30,.45); border-radius:18px; padding:15px; animation:word .55s var(--ease) both 1.7s}
.trap .k{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--orange)}
.trap p{margin:6px 0 10px; color:#fff; font-size:15.5px; line-height:1.42}
.gauge{display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:600; color:var(--mist)}
.gauge .t{flex:1; height:10px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden}
.gauge .f{height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--orange)); animation:fill 1.3s cubic-bezier(.65,0,.35,1) forwards 2.1s}
@keyframes fill{to{width:var(--to)}}
.gauge .pc{min-width:42px; text-align:right; color:var(--orange); font-variant-numeric:tabular-nums}
.locked{margin-top:12px; display:grid; gap:8px; text-align:left; animation:word .5s var(--ease) both 2.6s}
.lk{display:flex; gap:10px; align-items:center; padding:11px 12px; border-radius:14px; background:rgba(24,24,74,.85); border:1px dashed rgba(139,131,255,.38); font-size:14.5px; color:var(--pearl)}
.lk b{color:#fff}
.lk svg{flex:none}
.cap-sub{color:var(--pearl); font-size:16px; margin-bottom:16px}
.res-block{background:rgba(24,24,74,.85); border:1px solid rgba(139,131,255,.28); border-radius:18px; padding:18px 18px; margin:14px 0; text-align:left}
.res-block .lbl{color:var(--accent); font-weight:700; font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px}
.res-block h4{color:#fff; font-size:19px; margin-bottom:10px}
.res-block p{color:var(--pearl); font-size:15.5px; margin:0 0 10px}
.res-block p:last-child{margin-bottom:0}
.res-phrase{background:rgba(84,74,250,.14); border-left:3px solid var(--indigo); padding:14px 16px; border-radius:10px; color:#fff; font-style:italic; font-size:16px; margin-top:6px}

/* Capture */
.capture .cap-h{margin-top:10px}
.lock{display:grid; gap:8px; margin:4px 0 12px}
.wa-note{display:flex; gap:11px; align-items:flex-start; background:rgba(37,211,102,.10); border:1px solid rgba(37,211,102,.35); border-radius:14px; padding:13px 14px; margin:12px 0 6px; font-size:14.5px; line-height:1.42}
.wa-note b{color:#fff}
.wa-note svg{flex:none; margin-top:1px}
.field{margin:12px 0}
.field label{display:block; font-size:13.5px; color:#fff; font-weight:600; margin-bottom:6px}
.field input{width:100%; min-height:52px; background:rgba(10,10,30,.55); border:1.5px solid rgba(139,131,255,.3); border-radius:14px; padding:13px 14px; color:#fff; font-family:inherit; font-size:16px; transition:border-color .2s, box-shadow .2s}
.field input::placeholder{color:#7d78a3}
.field input:focus{outline:none; border-color:var(--indigo); box-shadow:0 0 0 4px rgba(84,74,250,.25)}
.field input.err{border-color:var(--err)}
.ferr{display:none; margin-top:6px; font-size:13px; color:var(--err)}
.field.bad .ferr{display:block}
.errmsg{color:var(--err); font-size:13.5px; margin-top:8px; text-align:center; min-height:1px}
.note-out{color:var(--mist); font-size:12.5px; text-align:center; margin-top:12px; line-height:1.5}
.rgpd{display:flex; gap:10px; align-items:flex-start; margin:14px 0 2px; font-size:13px; color:var(--mist); text-align:left; cursor:pointer; line-height:1.5}
.rgpd input{width:22px; height:22px; margin-top:1px; accent-color:var(--indigo); flex:none}
.rgpd a{color:#b5b0ff}
.rgpd.bad{color:var(--err)}

/* Attente */
.pile{position:relative; height:186px; margin-top:4px}
.pile .ob{position:absolute; left:50%; top:14px; width:140px; margin-left:-70px}
.sheet{position:absolute; left:50%; top:80px; width:48px; height:36px; margin-left:-24px; border-radius:8px; background:linear-gradient(180deg,#fff,#E6E3FF); box-shadow:0 6px 12px rgba(0,0,0,.3); opacity:0; animation:sheet .75s var(--ease) both; animation-delay:var(--d)}
.sheet::before{content:""; position:absolute; left:8px; right:8px; top:9px; height:4px; border-radius:3px; background:#C9C4F5}
.sheet::after{content:""; position:absolute; left:8px; width:20px; top:18px; height:4px; border-radius:3px; background:#F7C08A}
@keyframes sheet{0%{opacity:0; transform:translate(var(--x),var(--y)) rotate(70deg)}70%{opacity:1}100%{opacity:0; transform:translate(0,0) rotate(var(--r))}}
.loaders{padding:12px 4px 6px; text-align:left; max-width:340px; margin:0 auto}
.ldr{display:flex; gap:12px; align-items:center; margin:14px 0; color:var(--mist); font-size:15.5px; transition:color .3s}
.ldr .dot{width:24px; height:24px; border-radius:99px; border:2.5px solid rgba(84,74,250,.4); flex:none; display:grid; place-items:center; transition:background .25s, border-color .25s, transform .35s var(--spring)}
.ldr.on{color:#fff}
.ldr.on .dot{border-color:var(--indigo); animation:ping 1s ease-in-out infinite}
@keyframes ping{50%{box-shadow:0 0 0 6px rgba(84,74,250,.25)}}
.ldr.done{color:#fff}
.ldr.done .dot{background:var(--indigo); border-color:var(--indigo); transform:scale(1.1); animation:none}

/* Boutons */
.btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:56px; background:var(--indigo); color:#fff!important; font-weight:700; font-size:16.5px; text-align:center; text-decoration:none; border:none; border-radius:var(--radius); padding:16px 22px; margin-top:16px; cursor:pointer; box-shadow:0 12px 30px rgba(84,74,250,.45), inset 0 1px 0 rgba(255,255,255,.25); transition:transform .2s, box-shadow .2s, filter .2s; font-family:inherit; -webkit-tap-highlight-color:transparent}
.btn:hover{transform:translateY(-2px); box-shadow:0 18px 44px rgba(84,74,250,.55); filter:brightness(1.08)}
.btn .arr{transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
.btn.breathe{animation:breathe 2.2s ease-in-out infinite 1.2s}
@keyframes breathe{0%,100%{box-shadow:0 12px 30px rgba(84,74,250,.5), inset 0 1px 0 rgba(255,255,255,.25)}50%{box-shadow:0 12px 44px rgba(139,131,255,.85), inset 0 1px 0 rgba(255,255,255,.25)}}
.btn[disabled]{opacity:.6; cursor:default; transform:none}
.cta-dock .btn{margin-top:0}
footer{padding:36px 0 50px; text-align:center}
footer p{color:var(--mist); font-size:12px; max-width:640px; margin:0 auto; line-height:1.7}
@media(min-width:641px){ .card{padding:30px 26px} .cta-dock{position:static; margin:18px 0 0; padding:0; background:none} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important; animation-delay:0s!important; animation-iteration-count:1!important; transition-duration:.01ms!important} }
</style>
</head>
<body>

  <div class="pbar-shell" id="pbar">
    <div class="wrap pbar-row">
      <button class="back" id="back" aria-label="Question précédente" disabled>←</button>
      <div class="pbar-main">
        <div class="pbar-lbl"><span id="ptag"></span><b id="ptxt"></b></div>
        <div class="segs" id="segs"></div>
      </div>
    </div>
  </div>

  <div class="top wrap"><span class="kicker">Diagnostic Persua · neuro-vente</span></div>

  <div class="wrap">
    <div class="card" id="card"><!-- rempli par JS --></div>
  </div>

  <footer class="wrap">
    <p>Copyright © 2022–2026 · Tous droits réservés · Persua SASU · SIRET 100 132 497 00015 · TVA FR46100132497 · APE 8559A (Organisme de formation)</p>
  </footer>

  <script src="quiz_data.js"></script>
  <script src="audit_data.js"></script>
  <script>
  /* ====== Webhook Make (lead → systeme.io + Notion + WhatsApp). Tiré 1× à la capture. Vide = test sans envoi. ====== */
  const LEAD_WEBHOOK  = 'https://hook.eu2.make.com/l27k4pclyo9u4xjtbgdmt5ibhrpe2fc6';
  /* ====== Fin d'audit : 2e alerte avec score /100 (même scénario Make). Sert aussi de base à l'app-sync Phase 2. ====== */
  const SCORE_WEBHOOK = 'https://hook.eu2.make.com/l27k4pclyo9u4xjtbgdmt5ibhrpe2fc6';
  /* ====== Tracking funnel (F1 audit) : pings view / start / cta_click, sans données perso.
     Même webhook que les leads, le routeur Make (ajouté 18/08) route sur `stage` : lead|complete → chaîne systeme.io, le reste → data store « Funnel diagnostic, tracking ». ====== */
  const TRACK_WEBHOOK = 'https://hook.eu2.make.com/l27k4pclyo9u4xjtbgdmt5ibhrpe2fc6';
  /* ========================================================================================================= */

  (function(){
    const NT1 = 1 + QUIZ.PROFILE_Q.length;   // 6  (métier + 5 profil)  -> Temps 1
    const NT2 = AUDIT.Q.length;              // 14 (audit raccourci)    -> Temps 2
    const card = document.getElementById('card');
    const pbar = document.getElementById('pbar');
    const segs = document.getElementById('segs');
    const ptxt = document.getElementById('ptxt');
    const ptag = document.getElementById('ptag');
    const back = document.getElementById('back');

    /* Objets 3D jouet : un par profil (remplacent les emojis), avec leur geste CSS */
    const TOY = { F:'assets/toy/eclair.webp', E:'assets/toy/dossiers.webp', R:'assets/toy/poignee.webp', C:'assets/toy/cameleon.webp' };
    const GAUGE = { F:['Pression ressentie',88], E:['Charge mentale',100], R:['Ventes qui traînent',82], C:['Décisions reportées',85] };
    const toy = (k, extra) => '<span class="ob a-'+k+'"'+(extra||'')+'><img src="'+TOY[k]+'" alt="" width="420" height="420" decoding="async">'+(k==='E'?'<i class="fly"></i>':'')+'</span>';
    const TICK = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.5l2.6 2.6L11 4.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const LOCK = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3.5" y="8" width="11" height="8" rx="2.5" fill="#8B83FF"/><path d="M6 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="#8B83FF" stroke-width="2"/></svg>';
    const WA = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#25D366"/><path d="M6 10.5l2.4 2.4L14 7.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

    let quizAns  = [];  // [metierId, L,L,L,L,L]  -> persua_quiz_v1
    let auditAns = [];  // [{i,s} x14]            -> persua_audit_v1
    let stage = 'intro';  // intro | t1 | reveal1 | capture | reveal2 | t2
    let i1 = 0;           // 0..NT1-1
    let i2 = 0;           // 0..NT2-1
    let busy = false;     // pendant l'animation de sortie d'une question

    function persist(){
      try{ localStorage.setItem('persua_quiz_v1', JSON.stringify(quizAns)); }catch(e){}
      try{ localStorage.setItem('persua_audit_v1', JSON.stringify(auditAns)); }catch(e){}
    }
    /* Barre : n segments, i = segments remplis */
    function showChrome(on, tag, label, total, done, backOn){
      pbar.classList.toggle('on', !!on);
      if(!on) return;
      ptag.textContent = tag || ''; ptxt.textContent = label || '';
      if(segs.children.length !== total){ segs.innerHTML = ''; for(let k=0;k<total;k++) segs.appendChild(document.createElement('i')); }
      [...segs.children].forEach((s,k)=>s.classList.toggle('on', k < done));
      back.classList.toggle('hide', backOn === false);
    }
    function ping(stage){
      if(!TRACK_WEBHOOK) return;
      try{ fetch(TRACK_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'diagnostic_persua', tracking:true, stage:stage})}).catch(()=>{}); }catch(e){}
    }
    try{ if(!sessionStorage.getItem('persua_viewed')){ sessionStorage.setItem('persua_viewed','1'); ping('view'); } }catch(e){ ping('view'); }
    function toTop(){ window.scrollTo({top:0, behavior: reduceMotion ? 'auto' : 'smooth'}); }
    function paint(html, flow){
      card.className = 'card' + (flow ? ' flow' : '');
      card.innerHTML = '<div class="enter">'+html+'</div>';
    }
    /* Choix d'une réponse : onde + sélection, puis sortie animée avant la suite */
    function choose(btn, ev, next){
      if(busy) return; busy = true;
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      const r = btn.getBoundingClientRect(); const rp = document.createElement('span'); rp.className = 'ripple';
      rp.style.left = ((ev && ev.clientX ? ev.clientX - r.left : r.width/2))+'px'; rp.style.top = ((ev && ev.clientY ? ev.clientY - r.top : r.height/2))+'px';
      btn.appendChild(rp); btn.classList.add('sel');
      const wait = reduceMotion ? 120 : 380;
      setTimeout(()=>{ const c = card.firstElementChild; if(c && !reduceMotion) c.classList.add('leave'); }, wait);
      setTimeout(()=>{ busy = false; next(); }, wait + (reduceMotion ? 0 : 230));
    }
    function optsHTML(opts, sel){
      return '<div class="opts">'+opts.map((t,i)=>'<button class="opt'+(i===sel?' sel':'')+'" data-i="'+i+'"><span class="letter">'+'ABCDEFGH'[i]+'</span><span>'+t+'</span><span class="tick">'+TICK+'</span></button>').join('')+'</div>';
    }

    /* ---------- INTRO ---------- */
    function renderIntro(){
      stage='intro'; showChrome(false);
      paint(
        '<div class="intro">'+
        '<div class="orbit" aria-hidden="true">'+
          toy('F',' style="left:1%;top:34px;--d:.05s;--r:-5deg"')+toy('E',' style="left:26%;top:0;--d:.2s;--r:4deg"')+
          toy('R',' style="left:52%;top:6px;--d:.35s;--r:3deg"')+toy('C',' style="left:77%;top:38px;--d:.5s;--r:-4deg"')+
        '</div>'+
        '<h1>Quel <span class="hl">vendeur</span> <span class="nw">es-tu vraiment&nbsp;?</span></h1>'+
        '<p class="lead">Fonceur, Expert, Relationnel ou Caméléon : découvre ton profil et le piège qui te fait perdre des ventes.</p>'+
        '<div class="tcards">'+
          '<div class="tcard">'+toy('R')+'<div><div class="k free">Temps 1 · gratuit, immédiat</div><b>Ton profil de vendeur</b><span>et ta phrase-réflexe pour ton prochain rendez-vous</span></div></div>'+
          '<div class="tcard">'+toy('E')+'<div><div class="k">Temps 2 · si tu veux aller au bout</div><b>Ton score /100</b><span>tes 7 leviers passés au crible, ta fuite n°1 et quoi réparer en premier</span></div></div>'+
        '</div>'+
        '<div class="cta-dock"><button class="btn breathe" id="start">Découvrir mon profil <span class="arr">→</span></button><div class="micro">90 sec pour le profil · 100% gratuit · résultat à l\'écran</div></div>'+
        '</div>', true);
      document.getElementById('start').addEventListener('click', ()=>{ ping('start'); stage='t1'; i1=0; renderT1(); });
    }

    /* ---------- TEMPS 1 : métier + profil (6 q) ---------- */
    function renderT1(){
      stage='t1';
      showChrome(true, 'Ton profil', (i1+1)+' / '+NT1, NT1, i1);
      back.disabled = false;
      let tag, qtext, opts;
      if(i1===0){ tag='Pour commencer'; qtext='Quel est ton métier ?'; opts = QUIZ.METIERS.map(m=>m.label); }
      else { const q=QUIZ.PROFILE_Q[i1-1]; tag='Question '+i1+' sur '+(NT1-1); qtext=q.q; opts=q.opts.map(o=>o.t); }
      const sel = i1===0 ? QUIZ.METIERS.findIndex(m=>m.id===quizAns[0])
                         : (QUIZ.PROFILE_Q[i1-1].opts.findIndex(o=>o.p===quizAns[i1]));
      paint('<div class="dim-tag">'+tag+'</div><div class="qtext'+(qtext.length>110?' long':'')+'">'+qtext+'</div>'+optsHTML(opts, sel)+'<div class="hint">Choisis la réponse la plus honnête.</div>', true);
      card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click', ev=>choose(b, ev, ()=>pickT1(+b.getAttribute('data-i')))));
      toTop();
    }
    function pickT1(optIndex){
      if(i1===0){ quizAns[0] = QUIZ.METIERS[optIndex].id; }
      else { quizAns[i1] = QUIZ.PROFILE_Q[i1-1].opts[optIndex].p; }
      persist();
      if(i1 < NT1-1){ i1++; renderT1(); }
      else { renderReveal1(); }
    }

    /* ---------- RÉVÉLATION 1 (gratuite) : profil + piège ---------- */
    function renderReveal1(){
      stage='reveal1'; showChrome(false);
      const k = QUIZ.computeProfile(quizAns);
      const prof = QUIZ.getProfile(quizAns);
      const g = GAUGE[k] || ['Risque', 85];
      const words = ('Tu vends en mode… '+prof.titre+'.').split(' ');
      const piege = prof.piege.replace(/^Ton piège\s*:\s*/,'');
      let h = '<div class="reveal">';
      h += '<span class="chip">Temps 1 · ton profil de vendeur</span>';
      h += '<div class="drop" aria-hidden="true">'+toy(k)+'<div class="ring"></div></div>';
      h += '<h2 class="cap-h">'+words.map((w,i)=>'<span class="w" style="--i:'+i+'">'+w+'</span>').join(' ')+'</h2>';
      h += '<p class="desc">'+prof.desc+'</p>';
      h += '<div class="trap"><div class="k">Ton piège</div><p>'+piege.charAt(0).toUpperCase()+piege.slice(1)+'</p>';
      h += '<div class="gauge"><span>'+g[0]+'</span><div class="t"><div class="f" style="--to:'+g[1]+'%"></div></div><span class="pc" id="pc">0 %</span></div></div>';
      h += '<div class="locked">';
      h += '<div class="lk">'+LOCK+'<span>Ton <b>levier Persua</b> pour retourner ce piège</span></div>';
      h += '<div class="lk">'+LOCK+'<span>L\'<b>objection-reine</b> de ton métier + ta phrase-réflexe</span></div>';
      h += '<div class="lk">'+LOCK+'<span>Ton <b>score /100</b> sur tes 7 leviers</span></div>';
      h += '</div>';
      h += '<button class="btn breathe" id="next">Recevoir la suite de mon diagnostic <span class="arr">→</span></button>';
      h += '</div>';
      paint(h, true);
      document.getElementById('next').addEventListener('click', renderCapture);
      toTop();
      /* compteur de la jauge, calé sur son animation CSS */
      const pc = document.getElementById('pc'), t0 = performance.now() + (reduceMotion ? 0 : 2100);
      (function tick(){ if(!document.body.contains(pc)) return; const p=Math.max(0,Math.min(1,(performance.now()-t0)/1300)); const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2; pc.textContent=Math.round(e*g[1])+' %'; if(p<1) setTimeout(tick,33); })();
    }

    /* ---------- CAPTURE (email) ---------- */
    function renderCapture(){
      stage='capture'; showChrome(true, 'Ton diagnostic', '65 %', 20, 13, false); persist();
      const prof = QUIZ.getProfile(quizAns);
      let h = '<div class="capture">';
      h += '<span class="chip solid">Débloque la suite</span>';
      h += '<h2 class="cap-h">Où je t\'envoie la suite de ton diagnostic ?</h2>';
      h += '<p class="cap-sub">Ta phrase-réflexe s\'affiche à l\'écran juste après. Et tu pourras enchaîner sur ton score /100 si tu veux aller au bout.</p>';
      h += '<div class="lock">';
      h += '<div class="lk">'+LOCK+'<span>Ton <b>levier Persua</b> : comment retourner le piège '+prof.titre.replace(/^Le /,'du ').replace(/^L\'/,'de l\'')+' à ton avantage.</span></div>';
      h += '<div class="lk">'+LOCK+'<span>L\'<b>objection-reine de ton métier</b> + ta <b>phrase-réflexe</b> (méthode AIR) à tester dès ton prochain RDV.</span></div>';
      h += '<div class="lk">'+LOCK+'<span>L\'accès à ton <b>audit /100</b> sur tes 7 leviers de vente.</span></div>';
      h += '</div>';
      h += '<div class="wa-note">'+WA+'<span>Et après ? <b>Je t\'écris personnellement sur WhatsApp dans la journée</b>, en 2 lignes, pour voir si mon approche peut vraiment t\'aider. <b>Sans blabla, sans pression</b>. Tu me dis stop quand tu veux.</span></div>';
      h += '<form id="leadform" novalidate>';
      h += '<div class="field" id="w-prenom"><label for="f-prenom">Prénom</label><input id="f-prenom" type="text" autocomplete="given-name" placeholder="Ton prénom"><div class="ferr">Ton prénom, s\'il te plaît.</div></div>';
      h += '<div class="field" id="w-email"><label for="f-email">Email</label><input id="f-email" type="email" inputmode="email" autocomplete="email" placeholder="ton@email.com"><div class="ferr">Un email valide pour t\'envoyer ton rapport (exemple : prenom@gmail.com).</div></div>';
      h += '<div class="field" id="w-tel"><label for="f-tel">Téléphone (WhatsApp)</label><input id="f-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78"><div class="ferr">Un numéro valide (c\'est là que je t\'écris sur WhatsApp).</div></div>';
      h += '<label class="rgpd" id="w-rgpd"><input type="checkbox" id="f-rgpd"><span>J\'accepte que Persua utilise mes réponses pour m\'envoyer mon diagnostic et me recontacter (email / WhatsApp). <a href="confidentialite.html" target="_blank">Politique de confidentialité</a> · désinscription en 1 clic.</span></label>';
      h += '<button class="btn" id="submit" type="submit">Voir la suite de mon diagnostic <span class="arr">→</span></button>';
      h += '<div class="errmsg" id="err" aria-live="polite"></div>';
      h += '<p class="note-out">Tes infos restent entre nous. Désinscription en 1 clic, zéro spam.</p>';
      h += '</form></div>';
      paint(h, false);
      toTop();

      const F = id => document.getElementById(id);
      const err = F('err');
      const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      const isTel = v => (v.replace(/[^0-9+]/g,'').length >= 9);
      const mark = (wrap, input, bad) => { F(wrap).classList.toggle('bad', bad); if(input) F(input).classList.toggle('err', bad); };
      /* validation à la sortie du champ, sans effacer la saisie */
      F('f-prenom').addEventListener('blur', ()=>{ const v=F('f-prenom').value.trim(); if(v) mark('w-prenom','f-prenom', false); });
      F('f-email').addEventListener('blur', ()=>{ const v=F('f-email').value.trim(); if(v) mark('w-email','f-email', !isEmail(v)); });
      F('f-tel').addEventListener('blur', ()=>{ const v=F('f-tel').value.trim(); if(v) mark('w-tel','f-tel', !isTel(v)); });
      F('leadform').addEventListener('submit', function(e){
        e.preventDefault();
        const prenom=F('f-prenom').value.trim(), nom='', email=F('f-email').value.trim(), tel=F('f-tel').value.trim();
        mark('w-prenom','f-prenom', !prenom); mark('w-email','f-email', !isEmail(email)); mark('w-tel','f-tel', !isTel(tel));
        const rgOk = F('f-rgpd').checked; F('w-rgpd').classList.toggle('bad', !rgOk);
        let bad=null;
        if(!prenom) bad='Ton prénom, s\'il te plaît.';
        else if(!isEmail(email)) bad='Un email valide pour t\'envoyer ton rapport.';
        else if(!isTel(tel)) bad='Un numéro valide (c\'est là que je t\'écris sur WhatsApp).';
        else if(!rgOk) bad='Coche la case de consentement pour recevoir ton diagnostic.';
        if(bad){ err.textContent=bad; const first=card.querySelector('.field.bad input')||F('f-rgpd'); first.focus({preventScroll:false}); return; }
        err.textContent='';
        const metier = QUIZ.getMetier(quizAns);
        const lead = {
          prenom, nom, email, tel,
          profil: prof.titre,
          metier: metier.label,
          objection_reine: metier.reine,
          source: 'diagnostic_persua',
          stage: 'lead'
        };
        try{ localStorage.setItem('persua_audit_lead', JSON.stringify(lead)); }catch(e){}
        // Lead sécurisé : on tire le webhook en tâche de fond, sans faire attendre l'utilisateur.
        if(LEAD_WEBHOOK){ try{ fetch(LEAD_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}).catch(()=>{}); }catch(e){} }
        renderReveal2();
      });
    }

    /* ---------- RÉVÉLATION 2 (post-capture) : levier + objection-reine + phrase AIR ---------- */
    function renderReveal2(){
      stage='reveal2'; showChrome(false);
      const k = QUIZ.computeProfile(quizAns);
      const prof = QUIZ.getProfile(quizAns);
      const metier = QUIZ.getMetier(quizAns);
      let h = '<div class="reveal">';
      h += '<span class="chip solid">Ton diagnostic · temps 2</span>';
      h += '<div class="drop" aria-hidden="true" style="height:150px">'+toy(k,' style="width:130px;margin-left:-65px"')+'<div class="ring"></div></div>';
      h += '<h2 class="cap-h">Voilà ce qui va changer tes rendez-vous.</h2>';
      h += '<div class="res-block"><div class="lbl">Ton levier Persua · '+prof.titre+'</div>';
      h += '<p>'+prof.levier+'</p></div>';
      h += '<div class="res-block"><div class="lbl">L\'objection-reine de ton métier · '+metier.label+'</div>';
      h += '<h4>'+metier.reine+'</h4>';
      h += '<p>'+metier.angle+'</p>';
      h += '<p style="margin-bottom:6px"><b>Ta phrase-réflexe, méthode AIR (Accepte → Interroge → Réponds), à tester dès ton prochain rendez-vous :</b></p>';
      h += '<div class="res-phrase">'+metier.phrase+'</div></div>';
      h += '<p class="cap-sub" style="margin-top:18px;text-align:left">Tu sais <b>comment</b> tu vends. Reste à savoir <b>où</b> tu perds des deals, précisément. 14 questions, ~2 minutes, et tu as ton score /100 sur tes 7 leviers.</p>';
      h += '<button class="btn breathe" id="startaudit">Lancer mon audit /100 <span class="arr">→</span></button>';
      h += '</div>';
      paint(h, true);
      document.getElementById('startaudit').addEventListener('click', ()=>{ stage='t2'; i2=0; renderT2(); });
      toTop();
    }

    /* ---------- TEMPS 2 : audit (14 q) ---------- */
    function dimLabel(id){ const d = AUDIT.DIMS.find(x=>x.id===id); return d ? d.label : ''; }
    function renderT2(){
      stage='t2';
      showChrome(true, 'Ton score /100', (i2+1)+' / '+NT2, NT2, i2);
      back.disabled = false;
      const q = AUDIT.Q[i2];
      const a = auditAns[i2]; const sel = a ? a.i : -1;
      paint('<div class="dim-tag">'+dimLabel(q.d)+'</div><div class="qtext'+(q.q.length>110?' long':'')+'">'+q.q+'</div>'+optsHTML(q.opts.map(o=>o.t), sel), true);
      card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click', ev=>choose(b, ev, ()=>pickT2(+b.getAttribute('data-i')))));
      toTop();
    }
    function pickT2(optIndex){
      const q = AUDIT.Q[i2];
      auditAns[i2] = { i:optIndex, s:q.opts[optIndex].s };
      persist();
      if(i2 < NT2-1){ i2++; renderT2(); }
      else { finish(); }
    }

    /* ---------- FIN : calcule le score, enrichit le lead, → page résultat ---------- */
    function finish(){
      persist();
      const r = AUDIT.score(auditAns);
      const prof = QUIZ.getProfile(quizAns);
      const metier = QUIZ.getMetier(quizAns);
      let lead = {};
      try{ lead = JSON.parse(localStorage.getItem('persua_audit_lead')) || {}; }catch(e){}
      Object.assign(lead, {
        profil: prof.titre,
        metier: metier.label,
        objection_reine: metier.reine,
        score: r.global,
        leviers_faibles: r.weakest.map(d=>d.label+' ('+d.pct+'%)'),
        point_fort: r.strongest.label+' ('+r.strongest.pct+'%)',
        dimensions: r.dims.map(d=>({dim:d.label, pct:d.pct})),
        source: 'diagnostic_persua',
        stage: 'complete'
      });
      try{ localStorage.setItem('persua_audit_lead', JSON.stringify(lead)); }catch(e){}
      // Phase 2 (enrichissement score, sans email) : inactif tant que SCORE_WEBHOOK est vide.
      if(SCORE_WEBHOOK){ try{ fetch(SCORE_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}).catch(()=>{}); }catch(e){} }
      renderWaiting();
    }

    /* ---------- WAITING PAGE : loaders séquencés (~3,6 s), puis résultat ---------- */
    function renderWaiting(){
      stage='waiting'; showChrome(false);
      const prof = QUIZ.getProfile(quizAns);
      const steps = [
        'Analyse de tes '+(NT1+NT2)+' réponses…',
        'Croisement avec ton profil '+prof.titre+'…',
        'Calcul de tes 7 leviers…',
        'Identification de ta fuite n°1…'
      ];
      let sheets = '';
      for(let k=0;k<10;k++){ sheets += '<div class="sheet" style="--x:'+(k%2?-170:150)+'px;--y:'+(-50+((k*37)%90))+'px;--r:'+(((k%3)-1)*14)+'deg;--d:'+(.1+k*.34).toFixed(2)+'s"></div>'; }
      let h = '<div style="text-align:center"><div class="pile" aria-hidden="true">'+toy('E')+sheets+'</div><h2 class="cap-h">Une seconde, j\'analyse tes réponses.</h2><div class="loaders">';
      steps.forEach((s,i)=>{ h += '<div class="ldr" id="ldr'+i+'"><span class="dot"></span><span>'+s+'</span></div>'; });
      h += '</div></div>';
      paint(h, true); toTop();
      let i = 0;
      (function step(){
        if(i>0){ const p=document.getElementById('ldr'+(i-1)); p.classList.remove('on'); p.classList.add('done'); p.querySelector('.dot').innerHTML=TICK; }
        if(i < steps.length){ document.getElementById('ldr'+i).classList.add('on'); i++; setTimeout(step, 900); }
        else { window.location.href='diagnostic_resultat.html'; }
      })();
    }

    /* ---------- Bouton Précédent (contextuel) ---------- */
    back.addEventListener('click', ()=>{
      if(busy) return;
      if(stage==='t1'){ if(i1>0){ i1--; renderT1(); } else { renderIntro(); } }
      else if(stage==='t2'){ if(i2>0){ i2--; renderT2(); } else { renderReveal2(); } }
    });

    renderIntro();
  })();
  </script>

</body>
</html>
