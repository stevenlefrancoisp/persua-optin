<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persua · Ton diagnostic de vente complet</title>
<script>if(window.top!==window.self){try{window.top.location.replace(window.location.href);}catch(e){}}</script>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{ --indigo:#544AFA; --electric:#4747FD; --deep:#13133A; --ink:#0A0A14; --pearl:#F4F2F8; --white:#FFFFFF; --mist:#9B96B8; --radius:16px; --wa:#25D366; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'General Sans',sans-serif; background-color:var(--deep);
  background-image:radial-gradient(55vw 55vw at 80% -5%, rgba(84,74,250,.18), rgba(19,19,58,0) 60%),radial-gradient(50vw 50vw at 10% 30%, rgba(71,71,253,.10), rgba(19,19,58,0) 55%);
  background-attachment:fixed; color:var(--pearl); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh}
.wrap{max-width:640px; margin:0 auto; padding:0 22px}
h1,h2,h3{font-weight:700; letter-spacing:-.02em; color:var(--white); line-height:1.16}
.ink{color:var(--indigo)}

.pbar-shell{position:sticky; top:0; z-index:5; background:rgba(19,19,58,.92); backdrop-filter:blur(8px); border-bottom:1px solid rgba(84,74,250,.25); padding:12px 0; display:none}
.pbar-shell.on{display:block}
.pbar-row{display:flex; align-items:center; gap:12px}
.pbar-track{flex:1; height:8px; background:rgba(255,255,255,.10); border-radius:99px; overflow:hidden}
.pbar-fill{height:100%; width:0; background:linear-gradient(90deg,var(--electric),var(--indigo)); border-radius:99px; transition:width .35s ease}
.pbar-txt{color:var(--mist); font-size:12.5px; font-weight:600; white-space:nowrap; letter-spacing:.03em}

.top{text-align:center; padding:30px 0 4px}
.top .kicker{color:var(--mist); font-weight:600; font-size:12px; letter-spacing:.16em; text-transform:uppercase}

.card{background:rgba(19,19,58,.72); border:1px solid rgba(84,74,250,.30); border-radius:22px; padding:30px 26px; box-shadow:0 24px 60px rgba(0,0,0,.5); margin:18px auto 0}
/* Intro */
.intro{text-align:center}
.intro h1{font-size:clamp(27px,5vw,38px); margin-bottom:14px}
.intro .lead{color:var(--pearl); font-size:16.5px; max-width:520px; margin:0 auto 18px}
.intro ul{list-style:none; text-align:left; max-width:460px; margin:0 auto 8px}
.intro li{display:flex; gap:10px; align-items:flex-start; padding:9px 0; color:var(--pearl); font-size:15px}
.intro li b{color:#fff}
.meta-line{color:var(--mist); font-size:13.5px; margin:16px 0 4px}
/* Questions */
.dim-tag{display:inline-block; background:rgba(84,74,250,.16); color:var(--pearl); font-weight:600; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; padding:6px 13px; border-radius:99px; margin-bottom:16px}
.qtext{font-size:clamp(19px,3vw,23px); color:#fff; margin-bottom:20px; line-height:1.3}
.opt{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left; background:rgba(10,10,20,.4); border:1.5px solid rgba(84,74,250,.28); border-radius:14px; padding:15px 17px; margin:10px 0; color:var(--pearl); font-family:inherit; font-size:15.5px; line-height:1.4; cursor:pointer; transition:border-color .15s, background .15s, transform .1s}
.opt:hover{border-color:var(--indigo); background:rgba(84,74,250,.10)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--indigo); background:rgba(84,74,250,.18); color:#fff}
.opt .em{font-size:18px; line-height:1.3}
/* Révélations (temps 1 & 2) */
.res-badge{display:inline-block; background:var(--indigo); color:#fff; font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; padding:7px 14px; border-radius:99px; margin-bottom:14px}
.res-badge.free{background:rgba(84,74,250,.18); color:var(--pearl); border:1px solid rgba(84,74,250,.4)}
.cap-h{font-size:clamp(22px,4vw,29px); margin-bottom:8px}
.cap-sub{color:var(--pearl); font-size:15.5px; margin-bottom:16px}
.res-block{background:rgba(10,10,20,.4); border:1px solid rgba(84,74,250,.28); border-radius:16px; padding:20px 22px; margin:14px 0; text-align:left}
.res-block .lbl{color:var(--indigo); font-weight:700; font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:8px}
.res-block h4{color:#fff; font-size:19px; margin-bottom:10px}
.res-block p{color:var(--pearl); font-size:15.5px; margin:0 0 10px}
.res-block p:last-child{margin-bottom:0}
.res-phrase{background:rgba(84,74,250,.12); border-left:3px solid var(--indigo); padding:14px 16px; border-radius:8px; color:#fff; font-style:italic; font-size:16px; margin-top:6px}
/* Capture */
.lock .l{display:flex; gap:11px; align-items:flex-start; background:rgba(10,10,20,.4); border:1px solid rgba(84,74,250,.22); border-radius:12px; padding:12px 14px; margin:9px 0; font-size:14.5px}
.lock .l .k{font-size:18px}
.lock .l b{color:#fff}
.wa-note{display:flex; gap:11px; align-items:flex-start; background:rgba(37,211,102,.10); border:1px solid rgba(37,211,102,.32); border-radius:12px; padding:13px 15px; margin:14px 0 4px; font-size:14.5px}
.wa-note .k{font-size:19px}
.wa-note b{color:#fff}
.field{margin:11px 0}
.field label{display:block; font-size:13px; color:var(--mist); font-weight:600; margin-bottom:5px}
.field input{width:100%; background:rgba(10,10,20,.5); border:1.5px solid rgba(84,74,250,.3); border-radius:12px; padding:14px 15px; color:#fff; font-family:inherit; font-size:16px}
.field input::placeholder{color:#6f6a90}
.field input:focus{outline:none; border-color:var(--indigo)}
.field input.err{border-color:#F4607A}
.row2{display:flex; gap:11px}
.row2 .field{flex:1}
.errmsg{color:#F4607A; font-size:13px; margin-top:8px; text-align:center; min-height:1px}
.note-out{color:var(--mist); font-size:12.5px; text-align:center; margin-top:12px; line-height:1.5}
.rgpd{display:flex; gap:10px; align-items:flex-start; margin:14px 0 2px; font-size:13px; color:var(--mist); text-align:left; cursor:pointer; line-height:1.5}
.rgpd input{width:18px; height:18px; margin-top:2px; accent-color:var(--indigo); flex:none}
.rgpd a{color:#a5a0ff}
/* Waiting page */
.loaders{padding:22px 4px 6px; text-align:left; max-width:400px; margin:0 auto}
.ldr{display:flex; gap:12px; align-items:center; margin:16px 0; color:var(--mist); font-size:15.5px}
.ldr .dot{width:22px; height:22px; border-radius:99px; border:2.5px solid rgba(84,74,250,.4); flex:none; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff}
.ldr.on{color:#fff}
.ldr.on .dot{border-color:var(--indigo); animation:ldrpulse 1s infinite}
.ldr.done{color:#fff}
.ldr.done .dot{background:var(--indigo); border-color:var(--indigo)}
@keyframes ldrpulse{0%,100%{border-color:rgba(84,74,250,.4)}50%{border-color:var(--indigo)}}
@media (prefers-reduced-motion: reduce){ .ldr.on .dot{animation:none} }
/* Boutons */
.btn{display:inline-block; width:100%; background:var(--indigo); color:#fff!important; font-weight:600; font-size:17px; text-align:center; text-decoration:none; border:none; border-radius:var(--radius); padding:17px 26px; margin-top:16px; cursor:pointer; box-shadow:0 12px 30px rgba(84,74,250,.4); transition:transform .2s,box-shadow .2s,filter .2s; font-family:inherit}
.btn:hover{transform:translateY(-2px); box-shadow:0 18px 44px rgba(84,74,250,.55); filter:brightness(1.08)}
.btn[disabled]{opacity:.6; cursor:default; transform:none}
.nav{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:12px}
.back{background:none; border:none; color:var(--mist); font-family:inherit; font-size:14px; cursor:pointer; padding:8px 4px}
.back:hover{color:var(--pearl)} .back[disabled]{opacity:.3; cursor:default}
.hint{color:var(--mist); font-size:13px; text-align:right; flex:1}
footer{padding:36px 0 50px; text-align:center}
footer p{color:var(--mist); font-size:12px; max-width:640px; margin:0 auto; line-height:1.7}
@media(max-width:640px){ .card{padding:24px 18px} .row2{flex-direction:column; gap:0} }
</style>
</head>
<body>

  <div class="pbar-shell" id="pbar">
    <div class="wrap pbar-row">
      <div class="pbar-track"><div class="pbar-fill" id="fill"></div></div>
      <div class="pbar-txt" id="ptxt"></div>
    </div>
  </div>

  <div class="top wrap"><span class="kicker">Diagnostic Persua · neuro-vente</span></div>

  <div class="wrap">
    <div class="card" id="card"><!-- rempli par JS --></div>
    <div class="nav" id="nav" style="display:none">
      <button class="back" id="back" disabled>← Précédent</button>
      <div class="hint">Choisis la réponse la plus honnête.</div>
    </div>
  </div>

  <footer class="wrap">
    <p>Copyright © 2022–2026 · Tous droits réservés · Persua SASU · SIRET 100 132 497 00015 · TVA FR46100132497 · APE 8559A (Organisme de formation)</p>
  </footer>

  <script src="quiz_data.js"></script>
  <script src="audit_data.js"></script>
  <script>
  /* ====== Webhook Make (lead → systeme.io + Notion + WhatsApp). Tiré 1× à la capture. Vide = test sans envoi. ====== */
  const LEAD_WEBHOOK  = 'https://hook.eu2.make.com/l27k4pclyo9u4xjtbgdmt5ibhrpe2fc6';
  /* ====== Fin d'audit : 2e alerte avec score /100 (même scénario Make). Sert aussi de base à l'app-sync Phase 2. ====== */
  const SCORE_WEBHOOK = 'https://hook.eu2.make.com/l27k4pclyo9u4xjtbgdmt5ibhrpe2fc6';
  /* ====== Tracking funnel (F1 audit) : pings view / start / cta_click, sans données perso. VIDE = OFF.
     Avant d'activer : ajouter un routeur sur `stage` dans Make (lead|complete → scénario actuel ; le reste → compteur). ====== */
  const TRACK_WEBHOOK = '';
  /* ========================================================================================================= */

  (function(){
    const NT1 = 1 + QUIZ.PROFILE_Q.length;   // 6  (métier + 5 profil)  -> Temps 1
    const NT2 = AUDIT.Q.length;              // 14 (audit raccourci)    -> Temps 2
    const card = document.getElementById('card');
    const pbar = document.getElementById('pbar');
    const nav  = document.getElementById('nav');
    const fill = document.getElementById('fill');
    const ptxt = document.getElementById('ptxt');
    const back = document.getElementById('back');

    let quizAns  = [];  // [metierId, L,L,L,L,L]  -> persua_quiz_v1
    let auditAns = [];  // [{i,s} x14]            -> persua_audit_v1
    let stage = 'intro';  // intro | t1 | reveal1 | capture | reveal2 | t2
    let i1 = 0;           // 0..NT1-1
    let i2 = 0;           // 0..NT2-1

    function persist(){
      try{ localStorage.setItem('persua_quiz_v1', JSON.stringify(quizAns)); }catch(e){}
      try{ localStorage.setItem('persua_audit_v1', JSON.stringify(auditAns)); }catch(e){}
    }
    function showChrome(on, label, navOn){
      pbar.classList.toggle('on', !!on);
      nav.style.display = (on && navOn!==false) ? 'flex' : 'none';
      if(label) ptxt.textContent = label;
    }
    function ping(stage){
      if(!TRACK_WEBHOOK) return;
      try{ fetch(TRACK_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'diagnostic_persua', tracking:true, stage:stage})}).catch(()=>{}); }catch(e){}
    }
    try{ if(!sessionStorage.getItem('persua_viewed')){ sessionStorage.setItem('persua_viewed','1'); ping('view'); } }catch(e){ ping('view'); }
    function toTop(){ window.scrollTo({top:0, behavior:'smooth'}); }

    /* ---------- INTRO ---------- */
    function renderIntro(){
      stage='intro'; showChrome(false);
      card.innerHTML =
        '<div class="intro">'+
        '<h1>Quel <span class="ink">vendeur</span> es-tu vraiment&nbsp;?</h1>'+
        '<p class="lead">Un diagnostic neuro-vente en deux temps. D\'abord ton profil de vendeur et l\'objection-reine de ton métier (90 secondes). Puis, si tu veux aller au bout, ton score /100 sur tes 7 leviers, pour savoir exactement où tu perds des deals.</p>'+
        '<ul>'+
        '<li><span class="em">🧠</span><span><b>Temps 1 · gratuit, immédiat</b> : ton profil de vendeur + ta phrase-réflexe pour ton prochain rendez-vous.</span></li>'+
        '<li><span class="em">📊</span><span><b>Temps 2 · ton score /100</b> : tes 7 leviers passés au crible, ta fuite n°1 et quoi réparer en premier.</span></li>'+
        '</ul>'+
        '<p class="meta-line">⏱️ 90 sec pour le profil · 100% gratuit · résultat à l\'écran</p>'+
        '<button class="btn" id="start">DÉCOUVRIR MON PROFIL →</button>'+
        '</div>';
      document.getElementById('start').addEventListener('click', ()=>{ ping('start'); stage='t1'; i1=0; renderT1(); });
    }

    /* ---------- TEMPS 1 : métier + profil (6 q) ---------- */
    function renderT1(){
      stage='t1';
      showChrome(true, (i1+1)+' / '+NT1+' · Ton profil');
      fill.style.width = (i1/NT1*100)+'%';
      back.disabled = false;
      let tag, qtext, opts;
      if(i1===0){ tag='Pour commencer'; qtext='Quel est ton métier ?'; opts = QUIZ.METIERS.map(m=>({em:m.emoji, t:m.label})); }
      else { const q=QUIZ.PROFILE_Q[i1-1]; tag='Ton profil de vendeur'; qtext=q.q; opts=q.opts.map(o=>({em:o.em, t:o.t})); }
      let h = '<div class="dim-tag">'+tag+'</div><div class="qtext">'+qtext+'</div>';
      const sel = i1===0 ? QUIZ.METIERS.findIndex(m=>m.id===quizAns[0])
                         : (QUIZ.PROFILE_Q[i1-1].opts.findIndex(o=>o.p===quizAns[i1]));
      opts.forEach((o,i)=>{ h += '<button class="opt'+(i===sel?' sel':'')+'" data-i="'+i+'">'+(o.em?'<span class="em">'+o.em+'</span>':'')+'<span>'+o.t+'</span></button>'; });
      card.innerHTML = h;
      card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click', ()=>pickT1(+b.getAttribute('data-i'))));
      toTop();
    }
    function pickT1(optIndex){
      if(i1===0){ quizAns[0] = QUIZ.METIERS[optIndex].id; }
      else { quizAns[i1] = QUIZ.PROFILE_Q[i1-1].opts[optIndex].p; }
      persist();
      if(i1 < NT1-1){ i1++; setTimeout(renderT1, 150); }
      else { renderReveal1(); }
    }

    /* ---------- RÉVÉLATION 1 (gratuite) : profil + piège ---------- */
    function renderReveal1(){
      stage='reveal1'; showChrome(false);
      const prof = QUIZ.getProfile(quizAns);
      let h = '';
      h += '<div class="res-badge free">🎁 Temps 1 · ton profil de vendeur</div>';
      h += '<h2 class="cap-h">'+prof.emoji+' Tu vends en mode… '+prof.titre+'.</h2>';
      h += '<div class="res-block"><p>'+prof.desc+'</p>';
      h += '<p><b>⚠️ '+prof.piege+'</b></p></div>';
      h += '<p class="cap-sub">Il te manque une chose : <b>comment</b> transformer ce piège en levier, et l\'objection-reine que ton métier t\'envoie sans arrêt. Je te donne les deux tout de suite.</p>';
      h += '<button class="btn" id="next">RECEVOIR LA SUITE DE MON DIAGNOSTIC →</button>';
      card.innerHTML = h;
      document.getElementById('next').addEventListener('click', renderCapture);
      toTop();
    }

    /* ---------- CAPTURE (email) ---------- */
    function renderCapture(){
      stage='capture'; showChrome(true, 'Ton diagnostic · 65 %', false); fill.style.width='65%'; persist();
      const prof = QUIZ.getProfile(quizAns);
      let h = '';
      h += '<div class="res-badge">🔓 Débloque la suite</div>';
      h += '<h2 class="cap-h">Où je t\'envoie la suite de ton diagnostic ?</h2>';
      h += '<p class="cap-sub">Ta phrase-réflexe s\'affiche à l\'écran juste après. Et tu pourras enchaîner sur ton score /100 si tu veux aller au bout.</p>';
      h += '<div class="lock">';
      h += '<div class="l"><span class="k">🎯</span><span>Ton <b>levier Persua</b> : comment retourner le piège '+prof.titre.replace(/^Le /,'du ').replace(/^L\'/,'de l\'')+' à ton avantage.</span></div>';
      h += '<div class="l"><span class="k">💬</span><span>L\'<b>objection-reine de ton métier</b> + ta <b>phrase-réflexe</b> (méthode AIR) à tester dès ton prochain RDV.</span></div>';
      h += '<div class="l"><span class="k">📊</span><span>L\'accès à ton <b>audit /100</b> sur tes 7 leviers de vente.</span></div>';
      h += '</div>';
      h += '<div class="wa-note"><span class="k">📲</span><span>Et après ? <b>Je t\'écris personnellement sur WhatsApp dans la journée</b>, en 2 lignes, pour voir si mon approche peut vraiment t\'aider. <b>Sans blabla, sans pression</b>. Tu me dis stop quand tu veux.</span></div>';
      h += '<form id="leadform" novalidate>';
      h += '<div class="field"><label>Prénom</label><input id="f-prenom" type="text" autocomplete="given-name" placeholder="Ton prénom"></div>';
      h += '<div class="field"><label>Email</label><input id="f-email" type="email" autocomplete="email" placeholder="ton@email.com"></div>';
      h += '<div class="field"><label>Téléphone (WhatsApp)</label><input id="f-tel" type="tel" autocomplete="tel" placeholder="06 12 34 56 78"></div>';
      h += '<label class="rgpd"><input type="checkbox" id="f-rgpd"><span>J\'accepte que Persua utilise mes réponses pour m\'envoyer mon diagnostic et me recontacter (email / WhatsApp). <a href="confidentialite.html" target="_blank">Politique de confidentialité</a> · désinscription en 1 clic.</span></label>';
      h += '<button class="btn" id="submit" type="submit">VOIR LA SUITE DE MON DIAGNOSTIC →</button>';
      h += '<div class="errmsg" id="err"></div>';
      h += '<p class="note-out">Tes infos restent entre nous. Désinscription en 1 clic, zéro spam.</p>';
      h += '</form>';
      card.innerHTML = h;
      toTop();

      const F = id => document.getElementById(id);
      const err = F('err'), btn = F('submit');
      const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      const isTel = v => (v.replace(/[^0-9+]/g,'').length >= 9);
      F('leadform').addEventListener('submit', function(e){
        e.preventDefault();
        ['f-prenom','f-email','f-tel'].forEach(id=>F(id).classList.remove('err'));
        const prenom=F('f-prenom').value.trim(), nom='', email=F('f-email').value.trim(), tel=F('f-tel').value.trim();
        let bad=null;
        if(!prenom){ F('f-prenom').classList.add('err'); bad='Ton prénom, s\'il te plaît.'; }
        else if(!isEmail(email)){ F('f-email').classList.add('err'); bad='Un email valide pour t\'envoyer ton rapport.'; }
        else if(!isTel(tel)){ F('f-tel').classList.add('err'); bad='Un numéro valide (c\'est là que je t\'écris sur WhatsApp).'; }
        else if(!F('f-rgpd').checked){ bad='Coche la case de consentement pour recevoir ton diagnostic.'; }
        if(bad){ err.textContent=bad; return; }
        const metier = QUIZ.getMetier(quizAns);
        const lead = {
          prenom, nom, email, tel,
          profil: prof.titre,
          metier: metier.label,
          objection_reine: metier.reine,
          source: 'diagnostic_persua',
          stage: 'lead'
        };
        try{ localStorage.setItem('persua_audit_lead', JSON.stringify(lead)); }catch(e){}
        // Lead sécurisé : on tire le webhook en tâche de fond, sans faire attendre l'utilisateur.
        if(LEAD_WEBHOOK){ try{ fetch(LEAD_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}).catch(()=>{}); }catch(e){} }
        renderReveal2();
      });
    }

    /* ---------- RÉVÉLATION 2 (post-capture) : levier + objection-reine + phrase AIR ---------- */
    function renderReveal2(){
      stage='reveal2'; showChrome(false);
      const prof = QUIZ.getProfile(quizAns);
      const metier = QUIZ.getMetier(quizAns);
      let h = '';
      h += '<div class="res-badge">✅ Ton diagnostic · temps 2</div>';
      h += '<h2 class="cap-h">Voilà ce qui va changer tes rendez-vous.</h2>';
      h += '<div class="res-block"><div class="lbl">Ton levier Persua · '+prof.titre+'</div>';
      h += '<p>'+prof.levier+'</p></div>';
      h += '<div class="res-block"><div class="lbl">L\'objection-reine de ton métier · '+metier.label+'</div>';
      h += '<h4>'+metier.emoji+' '+metier.reine+'</h4>';
      h += '<p>'+metier.angle+'</p>';
      h += '<p style="margin-bottom:6px"><b>Ta phrase-réflexe, méthode AIR (Accepte → Interroge → Réponds), à tester dès ton prochain rendez-vous :</b></p>';
      h += '<div class="res-phrase">'+metier.phrase+'</div></div>';
      h += '<p class="cap-sub" style="margin-top:18px">Tu sais <b>comment</b> tu vends. Reste à savoir <b>où</b> tu perds des deals, précisément. 14 questions, ~2 minutes, et tu as ton score /100 sur tes 7 leviers.</p>';
      h += '<button class="btn" id="startaudit">LANCER MON AUDIT /100 →</button>';
      card.innerHTML = h;
      document.getElementById('startaudit').addEventListener('click', ()=>{ stage='t2'; i2=0; renderT2(); });
      toTop();
    }

    /* ---------- TEMPS 2 : audit (14 q) ---------- */
    function dimLabel(id){ const d = AUDIT.DIMS.find(x=>x.id===id); return d ? (d.emoji+' '+d.label) : ''; }
    function renderT2(){
      stage='t2';
      showChrome(true, (i2+1)+' / '+NT2+' · Ton score');
      fill.style.width = (i2/NT2*100)+'%';
      back.disabled = false;
      const q = AUDIT.Q[i2];
      let h = '<div class="dim-tag">'+dimLabel(q.d)+'</div><div class="qtext">'+q.q+'</div>';
      const a = auditAns[i2]; const sel = a ? a.i : -1;
      q.opts.forEach((o,i)=>{ h += '<button class="opt'+(i===sel?' sel':'')+'" data-i="'+i+'"><span>'+o.t+'</span></button>'; });
      card.innerHTML = h;
      card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click', ()=>pickT2(+b.getAttribute('data-i'))));
      toTop();
    }
    function pickT2(optIndex){
      const q = AUDIT.Q[i2];
      auditAns[i2] = { i:optIndex, s:q.opts[optIndex].s };
      persist();
      if(i2 < NT2-1){ i2++; setTimeout(renderT2, 150); }
      else { finish(); }
    }

    /* ---------- FIN : calcule le score, enrichit le lead, → page résultat ---------- */
    function finish(){
      persist();
      const r = AUDIT.score(auditAns);
      const prof = QUIZ.getProfile(quizAns);
      const metier = QUIZ.getMetier(quizAns);
      let lead = {};
      try{ lead = JSON.parse(localStorage.getItem('persua_audit_lead')) || {}; }catch(e){}
      Object.assign(lead, {
        profil: prof.titre,
        metier: metier.label,
        objection_reine: metier.reine,
        score: r.global,
        leviers_faibles: r.weakest.map(d=>d.label+' ('+d.pct+'%)'),
        point_fort: r.strongest.label+' ('+r.strongest.pct+'%)',
        dimensions: r.dims.map(d=>({dim:d.label, pct:d.pct})),
        source: 'diagnostic_persua',
        stage: 'complete'
      });
      try{ localStorage.setItem('persua_audit_lead', JSON.stringify(lead)); }catch(e){}
      // Phase 2 (enrichissement score, sans email) : inactif tant que SCORE_WEBHOOK est vide.
      if(SCORE_WEBHOOK){ try{ fetch(SCORE_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}).catch(()=>{}); }catch(e){} }
      renderWaiting();
    }

    /* ---------- WAITING PAGE : loaders séquencés (~3,6 s), puis résultat ---------- */
    function renderWaiting(){
      stage='waiting'; showChrome(false);
      const prof = QUIZ.getProfile(quizAns);
      const steps = [
        'Analyse de tes '+(NT1+NT2)+' réponses…',
        'Croisement avec ton profil '+prof.titre+'…',
        'Calcul de tes 7 leviers…',
        'Identification de ta fuite n°1…'
      ];
      let h = '<div style="text-align:center"><h2 class="cap-h">Une seconde, j\'analyse tes réponses.</h2><div class="loaders">';
      steps.forEach((s,i)=>{ h += '<div class="ldr" id="ldr'+i+'"><span class="dot"></span><span>'+s+'</span></div>'; });
      h += '</div></div>';
      card.innerHTML = h; toTop();
      let i = 0;
      (function step(){
        if(i>0){ const p=document.getElementById('ldr'+(i-1)); p.classList.remove('on'); p.classList.add('done'); p.querySelector('.dot').textContent='✓'; }
        if(i < steps.length){ document.getElementById('ldr'+i).classList.add('on'); i++; setTimeout(step, 900); }
        else { window.location.href='diagnostic_resultat.html'; }
      })();
    }

    /* ---------- Bouton Précédent (contextuel) ---------- */
    back.addEventListener('click', ()=>{
      if(stage==='t1'){ if(i1>0){ i1--; renderT1(); } else { renderIntro(); } }
      else if(stage==='t2'){ if(i2>0){ i2--; renderT2(); } else { renderReveal2(); } }
    });

    renderIntro();
  })();
  </script>

</body>
