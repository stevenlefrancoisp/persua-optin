<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persua — Ton diagnostic de vente complet</title>
<script>if(window.top!==window.self){try{window.top.location.replace(window.location.href);}catch(e){}}</script>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{ --indigo:#544AFA; --electric:#4747FD; --deep:#13133A; --ink:#0A0A14; --pearl:#F4F2F8; --white:#FFFFFF; --mist:#9B96B8; --radius:16px; --wa:#25D366; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'General Sans',sans-serif; background-color:var(--deep);
  background-image:radial-gradient(55vw 55vw at 80% -5%, rgba(84,74,250,.18), rgba(19,19,58,0) 60%),radial-gradient(50vw 50vw at 10% 30%, rgba(71,71,253,.10), rgba(19,19,58,0) 55%);
  background-attachment:fixed; color:var(--pearl); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh}
.wrap{max-width:640px; margin:0 auto; padding:0 22px}
h1,h2,h3{font-weight:700; letter-spacing:-.02em; color:var(--white); line-height:1.16}
.ink{color:var(--indigo)}

.pbar-shell{position:sticky; top:0; z-index:5; background:rgba(19,19,58,.92); backdrop-filter:blur(8px); border-bottom:1px solid rgba(84,74,250,.25); padding:12px 0; display:none}
.pbar-shell.on{display:block}
.pbar-row{display:flex; align-items:center; gap:12px}
.pbar-track{flex:1; height:8px; background:rgba(255,255,255,.10); border-radius:99px; overflow:hidden}
.pbar-fill{height:100%; width:0; background:linear-gradient(90deg,var(--electric),var(--indigo)); border-radius:99px; transition:width .35s ease}
.pbar-txt{color:var(--mist); font-size:12.5px; font-weight:600; white-space:nowrap; letter-spacing:.03em}

.top{text-align:center; padding:30px 0 4px}
.top .kicker{color:var(--mist); font-weight:600; font-size:12px; letter-spacing:.16em; text-transform:uppercase}

.card{background:rgba(19,19,58,.72); border:1px solid rgba(84,74,250,.30); border-radius:22px; padding:30px 26px; box-shadow:0 24px 60px rgba(0,0,0,.5); margin:18px auto 0}
/* Intro */
.intro{text-align:center}
.intro h1{font-size:clamp(27px,5vw,38px); margin-bottom:14px}
.intro .lead{color:var(--pearl); font-size:16.5px; max-width:520px; margin:0 auto 18px}
.intro ul{list-style:none; text-align:left; max-width:460px; margin:0 auto 8px}
.intro li{display:flex; gap:10px; align-items:flex-start; padding:9px 0; color:var(--pearl); font-size:15px}
.intro li b{color:#fff}
.meta-line{color:var(--mist); font-size:13.5px; margin:16px 0 4px}
/* Questions */
.dim-tag{display:inline-block; background:rgba(84,74,250,.16); color:var(--pearl); font-weight:600; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; padding:6px 13px; border-radius:99px; margin-bottom:16px}
.qtext{font-size:clamp(19px,3vw,23px); color:#fff; margin-bottom:20px; line-height:1.3}
.opt{display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left; background:rgba(10,10,20,.4); border:1.5px solid rgba(84,74,250,.28); border-radius:14px; padding:15px 17px; margin:10px 0; color:var(--pearl); font-family:inherit; font-size:15.5px; line-height:1.4; cursor:pointer; transition:border-color .15s, background .15s, transform .1s}
.opt:hover{border-color:var(--indigo); background:rgba(84,74,250,.10)}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--indigo); background:rgba(84,74,250,.18); color:#fff}
.opt .em{font-size:18px; line-height:1.3}
/* Capture */
.res-badge{display:inline-block; background:var(--indigo); color:#fff; font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; padding:7px 14px; border-radius:99px; margin-bottom:14px}
.cap-h{font-size:clamp(22px,4vw,29px); margin-bottom:8px}
.cap-sub{color:var(--pearl); font-size:15.5px; margin-bottom:16px}
.lock .l{display:flex; gap:11px; align-items:flex-start; background:rgba(10,10,20,.4); border:1px solid rgba(84,74,250,.22); border-radius:12px; padding:12px 14px; margin:9px 0; font-size:14.5px}
.lock .l .k{font-size:18px}
.lock .l b{color:#fff}
.wa-note{display:flex; gap:11px; align-items:flex-start; background:rgba(37,211,102,.10); border:1px solid rgba(37,211,102,.32); border-radius:12px; padding:13px 15px; margin:14px 0 4px; font-size:14.5px}
.wa-note .k{font-size:19px}
.wa-note b{color:#fff}
.field{margin:11px 0}
.field label{display:block; font-size:13px; color:var(--mist); font-weight:600; margin-bottom:5px}
.field input{width:100%; background:rgba(10,10,20,.5); border:1.5px solid rgba(84,74,250,.3); border-radius:12px; padding:14px 15px; color:#fff; font-family:inherit; font-size:16px}
.field input::placeholder{color:#6f6a90}
.field input:focus{outline:none; border-color:var(--indigo)}
.field input.err{border-color:#F4607A}
.row2{display:flex; gap:11px}
.row2 .field{flex:1}
.errmsg{color:#F4607A; font-size:13px; margin-top:8px; text-align:center; min-height:1px}
.note-out{color:var(--mist); font-size:12.5px; text-align:center; margin-top:12px; line-height:1.5}
/* Boutons */
.btn{display:inline-block; width:100%; background:var(--indigo); color:#fff!important; font-weight:600; font-size:17px; text-align:center; text-decoration:none; border:none; border-radius:var(--radius); padding:17px 26px; margin-top:16px; cursor:pointer; box-shadow:0 12px 30px rgba(84,74,250,.4); transition:transform .2s,box-shadow .2s,filter .2s; font-family:inherit}
.btn:hover{transform:translateY(-2px); box-shadow:0 18px 44px rgba(84,74,250,.55); filter:brightness(1.08)}
.btn[disabled]{opacity:.6; cursor:default; transform:none}
.nav{display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:12px}
.back{background:none; border:none; color:var(--mist); font-family:inherit; font-size:14px; cursor:pointer; padding:8px 4px}
.back:hover{color:var(--pearl)} .back[disabled]{opacity:.3; cursor:default}
.hint{color:var(--mist); font-size:13px; text-align:right; flex:1}
footer{padding:36px 0 50px; text-align:center}
footer p{color:var(--mist); font-size:12px; max-width:640px; margin:0 auto; line-height:1.7}
@media(max-width:640px){ .card{padding:24px 18px} .row2{flex-direction:column; gap:0} }
</style>
</head>
<body>

  <div class="pbar-shell" id="pbar">
    <div class="wrap pbar-row">
      <div class="pbar-track"><div class="pbar-fill" id="fill"></div></div>
      <div class="pbar-txt" id="ptxt"></div>
    </div>
  </div>

  <div class="top wrap"><span class="kicker">Diagnostic Persua · neuro-vente</span></div>

  <div class="wrap">
    <div class="card" id="card"><!-- rempli par JS --></div>
    <div class="nav" id="nav" style="display:none">
      <button class="back" id="back" disabled>← Précédent</button>
      <div class="hint">Choisis la réponse la plus honnête.</div>
    </div>
  </div>

  <footer class="wrap">
    <p>Copyright © 2022–2026 — Tous droits réservés · Persua SASU · SIRET 100 132 497 00015 · TVA FR46100132497 · APE 8559A (Organisme de formation)</p>
  </footer>

  <script src="quiz_data.js"></script>
  <script src="audit_data.js"></script>
  <script>
  /* ====== À BRANCHER : webhook Make (lead → systeme.io + Notion + WhatsApp). Vide = test sans envoi. ====== */
  const LEAD_WEBHOOK = '';
  /* ===================================================================================================== */

  (function(){
    // Séquence unifiée : 0 = métier · 1..5 = profil F/E/R/C · 6..55 = audit (50)
    const NQ_PROFILE = QUIZ.PROFILE_Q.length;          // 5
    const NQ_AUDIT   = AUDIT.Q.length;                 // 50
    const TOTAL      = 1 + NQ_PROFILE + NQ_AUDIT;       // 56
    const card = document.getElementById('card');
    const pbar = document.getElementById('pbar');
    const nav  = document.getElementById('nav');
    const fill = document.getElementById('fill');
    const ptxt = document.getElementById('ptxt');
    const back = document.getElementById('back');

    let quizAns  = [];  // [metierId, L,L,L,L,L]  -> persua_quiz_v1
    let auditAns = [];  // [{i,s} x50]            -> persua_audit_v1
    let idx = 0;        // 0..TOTAL-1 (puis TOTAL = capture)

    function phase(i){ if(i===0) return 'metier'; if(i<=NQ_PROFILE) return 'profile'; return 'audit'; }
    function dimLabel(id){ const d = AUDIT.DIMS.find(x=>x.id===id); return d ? (d.emoji+' '+d.label) : ''; }

    function showChrome(on){ pbar.classList.toggle('on', on); nav.style.display = on ? 'flex' : 'none'; }

    function renderIntro(){
      showChrome(false);
      card.innerHTML =
        '<div class="intro">'+
        '<h1>Découvre ton <span class="ink">score de vente</span> sur 100.</h1>'+
        '<p class="lead">Un diagnostic neuro-vente complet : ton profil de vendeur, l\'objection-reine de ton métier, et tes 7 leviers passés au crible. Tu sauras exactement où tu perds des deals — et quoi réparer en premier.</p>'+
        '<ul>'+
        '<li><span class="em">🧠</span><span>Ton <b>profil de vendeur</b> + l\'objection-reine de ton métier.</span></li>'+
        '<li><span class="em">📊</span><span>Ton <b>score /100</b> et le détail de tes 7 leviers (prospection, découverte, prix, closing…).</span></li>'+
        '<li><span class="em">🎯</span><span>Ta <b>fuite n°1</b> + ton plan concret pour la réparer.</span></li>'+
        '</ul>'+
        '<p class="meta-line">⏱️ ~6 minutes · 100% gratuit · résultat immédiat</p>'+
        '<button class="btn" id="start">COMMENCER MON DIAGNOSTIC →</button>'+
        '</div>';
      document.getElementById('start').addEventListener('click', ()=>{ idx=0; render(); });
    }

    function pick(optIndex){
      const ph = phase(idx);
      if(ph==='metier'){ quizAns[0] = QUIZ.METIERS[optIndex].id; }
      else if(ph==='profile'){ const q = QUIZ.PROFILE_Q[idx-1]; quizAns[idx] = q.opts[optIndex].p; }
      else { const q = AUDIT.Q[idx-1-NQ_PROFILE]; auditAns[idx-1-NQ_PROFILE] = { i:optIndex, s:q.opts[optIndex].s }; }
      persist();
      if(idx < TOTAL-1){ idx++; setTimeout(render, 150); }
      else { renderCapture(); }
    }

    function persist(){
      try{ localStorage.setItem('persua_quiz_v1', JSON.stringify(quizAns)); }catch(e){}
      try{ localStorage.setItem('persua_audit_v1', JSON.stringify(auditAns)); }catch(e){}
    }

    function selectedIndex(){
      const ph = phase(idx);
      if(ph==='metier'){ return QUIZ.METIERS.findIndex(m=>m.id===quizAns[0]); }
      if(ph==='profile'){ const q=QUIZ.PROFILE_Q[idx-1]; return q.opts.findIndex(o=>o.p===quizAns[idx]); }
      const a = auditAns[idx-1-NQ_PROFILE]; return a ? a.i : -1;
    }

    function render(){
      showChrome(true);
      const ph = phase(idx);
      fill.style.width = (idx/TOTAL*100)+'%';
      ptxt.textContent = (idx+1)+' / '+TOTAL;
      back.disabled = (idx===0);
      let h = '', opts = [], qtext = '', tag = '';
      if(ph==='metier'){ tag='Pour commencer'; qtext='Quel est ton métier ?'; opts = QUIZ.METIERS.map(m=>({em:m.emoji, t:m.label})); }
      else if(ph==='profile'){ const q=QUIZ.PROFILE_Q[idx-1]; tag='Ton profil de vendeur'; qtext=q.q; opts=q.opts.map(o=>({em:o.em, t:o.t})); }
      else { const q=AUDIT.Q[idx-1-NQ_PROFILE]; tag=dimLabel(q.d); qtext=q.q; opts=q.opts.map(o=>({em:'', t:o.t})); }
      h += '<div class="dim-tag">'+tag+'</div>';
      h += '<div class="qtext">'+qtext+'</div>';
      const sel = selectedIndex();
      opts.forEach((o,i)=>{ h += '<button class="opt'+(i===sel?' sel':'')+'" data-i="'+i+'">'+(o.em?'<span class="em">'+o.em+'</span>':'')+'<span>'+o.t+'</span></button>'; });
      card.innerHTML = h;
      card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click', ()=>pick(+b.getAttribute('data-i'))));
      window.scrollTo({top:0, behavior:'smooth'});
    }

    function renderCapture(){
      showChrome(false);
      persist();
      fill.style.width='100%';
      const r = AUDIT.score(auditAns);
      const weak = r.weakest[0];
      const prof = QUIZ.getProfile(quizAns);
      let h = '';
      h += '<div class="res-badge">✅ Diagnostic terminé</div>';
      h += '<h2 class="cap-h">'+prof.emoji+' Ton profil : '+prof.titre+'. Ton score est prêt.</h2>';
      h += '<p class="cap-sub">Laisse-moi où te l\'envoyer — et ton rapport complet s\'affiche aussitôt.</p>';
      h += '<div class="lock">';
      h += '<div class="l"><span class="k">📊</span><span>Ton <b>score /100</b> + le détail de tes 7 leviers de vente.</span></div>';
      h += '<div class="l"><span class="k">🎯</span><span>Ta fuite n°1 (<b>'+weak.emoji+' '+weak.label+'</b>) + ton plan pour la réparer.</span></div>';
      h += '<div class="l"><span class="k">💬</span><span>Ton <b>profil '+prof.titre+'</b> + l\'objection-reine de ton métier + ta phrase-réflexe.</span></div>';
      h += '</div>';
      h += '<div class="wa-note"><span class="k">📲</span><span>Et après ? <b>Je t\'envoie un petit message sur WhatsApp</b> pour voir, en 2 lignes, si mon approche peut vraiment t\'aider sur ton point faible. <b>Sans blabla, sans pression</b> — tu me dis stop quand tu veux.</span></div>';
      h += '<form id="leadform" novalidate>';
      h += '<div class="row2"><div class="field"><label>Prénom</label><input id="f-prenom" type="text" autocomplete="given-name" placeholder="Ton prénom"></div>';
      h += '<div class="field"><label>Nom</label><input id="f-nom" type="text" autocomplete="family-name" placeholder="Ton nom"></div></div>';
      h += '<div class="field"><label>Email</label><input id="f-email" type="email" autocomplete="email" placeholder="ton@email.com"></div>';
      h += '<div class="field"><label>Téléphone (WhatsApp)</label><input id="f-tel" type="tel" autocomplete="tel" placeholder="06 12 34 56 78"></div>';
      h += '<button class="btn" id="submit" type="submit">VOIR MON SCORE /100 →</button>';
      h += '<div class="errmsg" id="err"></div>';
      h += '<p class="note-out">Tes infos restent entre nous. Désinscription en 1 clic, zéro spam.</p>';
      h += '</form>';
      card.innerHTML = h;
      window.scrollTo({top:0, behavior:'smooth'});

      const F = id => document.getElementById(id);
      const err = F('err'), btn = F('submit');
      const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      const isTel = v => (v.replace(/[^0-9+]/g,'').length >= 9);
      F('leadform').addEventListener('submit', function(e){
        e.preventDefault();
        ['f-prenom','f-nom','f-email','f-tel'].forEach(id=>F(id).classList.remove('err'));
        const prenom=F('f-prenom').value.trim(), nom=F('f-nom').value.trim(), email=F('f-email').value.trim(), tel=F('f-tel').value.trim();
        let bad=null;
        if(!prenom){ F('f-prenom').classList.add('err'); bad='Ton prénom, s\'il te plaît.'; }
        else if(!nom){ F('f-nom').classList.add('err'); bad='Ton nom, s\'il te plaît.'; }
        else if(!isEmail(email)){ F('f-email').classList.add('err'); bad='Un email valide pour t\'envoyer ton rapport.'; }
        else if(!isTel(tel)){ F('f-tel').classList.add('err'); bad='Un numéro valide (c\'est là que je t\'écris sur WhatsApp).'; }
        if(bad){ err.textContent=bad; return; }
        err.textContent=''; btn.disabled=true; btn.textContent='Un instant…';
        const metier = QUIZ.getMetier(quizAns);
        const lead = {
          prenom, nom, email, tel,
          score: r.global,
          profil: prof.titre,
          metier: metier.label,
          objection_reine: metier.reine,
          leviers_faibles: r.weakest.map(d=>d.label+' ('+d.pct+'%)'),
          point_fort: r.strongest.label+' ('+r.strongest.pct+'%)',
          dimensions: r.dims.map(d=>({dim:d.label, pct:d.pct})),
          source: 'diagnostic_persua'
        };
        try{ localStorage.setItem('persua_audit_lead', JSON.stringify(lead)); }catch(e){}
        function go(){ window.location.href='diagnostic_resultat.html'; }
        if(LEAD_WEBHOOK){
          fetch(LEAD_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lead)}).then(go).catch(go);
          setTimeout(go, 2500);
        } else { go(); }
      });
    }

    back.addEventListener('click', ()=>{ if(idx>0){ idx--; render(); } });
    renderIntro();
  })();
  </script>

</body>
</html>
