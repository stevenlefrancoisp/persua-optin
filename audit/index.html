<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Chivo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#544AFA; --electric:#4747FD; --accent:#8B83FF; --deep:#13133A; --ink:#0A0A14; --nuit:#06060F; --orange:#F7931E;
  --blanc:#FFFFFF; --texte:#ECEBF7; --brume:#A9A5C9; --brume-2:#8B87AD; --ligne:rgba(139,131,255,.18); --carte:rgba(255,255,255,.035);
  --err:#FF8A8A; --r:16px;
  --display:'Archivo Black','Arial Black',system-ui,sans-serif; --label:'Chivo',system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@property --h{syntax:'<length>';inherits:true;initial-value:170px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--nuit)}
body{min-height:100vh;min-height:100svh;color:var(--texte);font:16px/1.55 'General Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:radial-gradient(900px 520px at 50% -80px,rgba(84,74,250,.30),transparent 70%),linear-gradient(180deg,var(--ink) 0,var(--nuit) 900px) no-repeat,var(--nuit)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(235,233,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(235,233,255,.03) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(80% 60% at 50% 30%,#000,transparent 85%)}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.page{position:relative;max-width:620px;margin:0 auto;padding:16px 20px calc(48px + env(safe-area-inset-bottom))}
.nw{white-space:nowrap}

/* ---------- transitions d'écran ---------- */
.ecran{animation:entre .5s var(--ease) both}
@keyframes entre{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
.ecran.sort{animation:sort .24s ease-in both}
@keyframes sort{to{opacity:0;transform:translateX(-32px)}}

/* ---------- mots qui montent ---------- */
.mot{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(5px);animation:mot .55s var(--ease) forwards;animation-delay:calc(var(--d,0ms) + var(--i,0) * 50ms)}
@keyframes mot{to{opacity:1;transform:none;filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* ---------- barre du haut (retour, progression, compteur) ---------- */
.barre{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:4px}
.retour{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--ligne);background:var(--carte);display:grid;place-items:center;color:var(--texte)}
.retour svg{width:18px;height:18px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:99px;background:rgba(139,131,255,.16);position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--electric),var(--accent));transform:scaleX(0);transform-origin:left;transition:transform .6s var(--spring)}
.segs i.fait::after{transform:scaleX(1)}
.compteur{flex:none;padding:6px 12px;border:1px solid var(--ligne);border-radius:99px;font:800 12px var(--label);letter-spacing:.12em;color:var(--accent);background:rgba(84,74,250,.10)}

/* ---------- le radar qui se dessine en direct ---------- */
.tableau{--h:clamp(124px,21svh,186px);transition:--h .6s var(--ease)}
.tableau[data-mode="intro"]{--h:clamp(150px,27svh,210px)}
.tableau[data-mode="calcul"]{--h:clamp(150px,26svh,214px)}
.radar-boite{position:relative;height:var(--h);margin:12px auto 0}
.radar-boite svg{position:absolute;left:50%;top:0;width:var(--h);height:var(--h);transform:translateX(-50%);overflow:visible}
.lab{position:absolute;left:calc(50% + var(--x) * (var(--h) * .42 + 10px));top:calc(50% + var(--y) * (var(--h) * .42 + 10px));font:800 11px/1 var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--brume-2);white-space:nowrap;opacity:.5;transition:color .4s,opacity .4s}
.lab.on{opacity:1;color:var(--texte)}
.lab.flash{animation:flash 1s var(--ease)}
@keyframes flash{0%{color:#fff;text-shadow:0 0 16px rgba(139,131,255,1)}100%{text-shadow:0 0 0 transparent}}
.lab.rupt{opacity:1;color:var(--orange)}
.r-grille{fill:none;stroke:rgba(139,131,255,.13);stroke-width:1}
.r-grille.bord{stroke:rgba(139,131,255,.30)}
.r-rayon{stroke:rgba(139,131,255,.12);stroke-width:1}
.r-forme{stroke:#8B83FF;stroke-width:2;stroke-linejoin:round}
.r-halo{fill:none;stroke:rgba(84,74,250,.75);stroke-width:7;stroke-linejoin:round}
.r-pt{fill:#fff;stroke:var(--indigo);stroke-width:2;opacity:0;transition:opacity .3s}
.r-pt.on{opacity:1}
.r-pt.rupt{fill:var(--orange);stroke:var(--orange)}
.r-onde{fill:none;stroke:var(--accent);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}
.r-onde.go{animation:onde .9s ease-out}
.r-onde.rupt{stroke:var(--orange);animation:onde 1.7s ease-out infinite}
@keyframes onde{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(4.6)}}
.r-centre{fill:var(--accent);opacity:0;transition:opacity .4s}
.vide .r-centre{opacity:.9;animation:centre 1.6s ease-in-out infinite}
@keyframes centre{50%{opacity:.2}}
.r-balai{opacity:0;transform-box:view-box;transform-origin:100px 100px;transition:opacity .3s}
.scan .r-balai{opacity:1;animation:balai 1.5s linear infinite}
@keyframes balai{to{transform:rotate(360deg)}}
.puces{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:27px;margin:14px 0 4px}
.tableau[data-mode="intro"] .puces,.tableau[data-mode="final"] .puces,.tableau[data-mode="calcul"] .puces{display:none}
.puce{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;border:1px solid var(--ligne);background:rgba(84,74,250,.10);font:800 11px/1.3 var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.puce i{font-style:normal;color:var(--brume-2)}
.puce.neuf{animation:pop .5s var(--spring) both}
.puces .aide{font-size:13px;color:var(--brume-2);align-self:center}

/* ---------- titres et étiquettes ---------- */
.etiq{display:block;text-align:center;font:800 12px var(--label);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.pilule{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--ligne);border-radius:99px;background:rgba(84,74,250,.10);font:700 13px var(--label);color:var(--accent)}
h1,h2{font-family:var(--display);font-weight:400;color:var(--blanc);letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(29px,7.4vw,46px);line-height:1.08}
h2{font-size:clamp(23px,6vw,31px);line-height:1.15;text-align:center}
.pave{color:#fff;padding:0 .14em;border-radius:.16em;background:linear-gradient(var(--indigo),var(--indigo)) no-repeat left/0% 100%;-webkit-box-decoration-break:clone;box-decoration-break:clone;animation:pave .7s var(--ease) forwards;animation-delay:var(--d,900ms)}
@keyframes pave{to{background-size:100% 100%;box-shadow:0 10px 34px rgba(84,74,250,.45)}}
.lv{color:var(--accent)}

/* ---------- accueil ---------- */
.intro{text-align:center;padding-top:6px}
.intro .pilule{margin:4px 0 18px;animation:mot .6s var(--ease) both .2s}
.intro h1{margin-bottom:20px}
.intro .h1b{display:block;margin-top:8px}
.intro .mal{color:var(--brume);font-size:17px;max-width:480px;margin:0 auto 14px;animation:mot .7s var(--ease) both 1.2s}
.intro .bascule{color:var(--blanc);font-weight:600;font-size:17px;max-width:480px;margin:0 auto 26px;animation:mot .7s var(--ease) both 1.35s}
.promesses{list-style:none;text-align:left;border:1px solid var(--ligne);background:var(--carte);border-radius:var(--r);padding:18px 22px;margin:0 auto 26px;max-width:480px}
.promesses li{display:flex;gap:14px;padding:7px 0;color:var(--texte);opacity:0;animation:mot .6s var(--ease) forwards;animation-delay:calc(1.5s + var(--i) * 110ms)}
.promesses li b{color:var(--blanc)}
.promesses .n{font:800 15px var(--label);color:var(--accent);flex:none;width:14px}
.promesses .pied{border-top:1px solid var(--ligne);margin-top:10px;padding-top:12px;justify-content:center;color:var(--brume);font-size:14px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border:0;border-radius:14px;background:var(--indigo);color:#fff;font:800 16px var(--label);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 14px 40px rgba(84,74,250,.45);transition:transform .2s var(--ease),background .2s;text-decoration:none}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.26),transparent);transform:skewX(-18deg);animation:reflet 3.6s ease-in-out infinite 2.4s}
@keyframes reflet{0%,70%{left:-60%}100%{left:130%}}
.btn:active{transform:scale(.97)}
.btn.plein{width:100%}
.btn.second{background:transparent;border:1px solid var(--ligne);box-shadow:none;color:var(--texte)}
.btn.second::after{display:none}
@media (hover:hover){.btn:hover{background:var(--electric)}.btn.second:hover{background:rgba(139,131,255,.08)}}
.intro .btn{animation:mot .6s var(--ease) both 1.9s}
.sous-btn{color:var(--brume-2);font-size:13px;margin-top:12px}
.preuve{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:28px;color:var(--brume);font-size:14px;text-align:left}
.preuve img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px rgba(139,131,255,.5)}
.preuve b{color:var(--blanc);font-weight:600}

/* ---------- questions ---------- */
.question{padding-top:6px}
.question h2{margin-bottom:18px}
.options{display:grid;gap:10px}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;min-height:54px;padding:12px 18px;text-align:left;border:1px solid var(--ligne);border-radius:14px;background:var(--carte);color:var(--blanc);font-weight:600;font-size:16px;line-height:1.35;opacity:0;animation:opt .45s var(--ease) forwards;transition:border-color .2s,background .2s,opacity .25s}
@keyframes opt{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.opt .rond{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid rgba(139,131,255,.4);display:grid;place-items:center;transition:background .2s,border-color .2s}
.opt .rond svg{width:13px;height:13px;transform:scale(0);transition:transform .35s var(--spring)}
.opt.sel{border-color:var(--indigo);background:linear-gradient(180deg,rgba(84,74,250,.30),rgba(84,74,250,.16));box-shadow:0 0 0 4px rgba(84,74,250,.16);animation:opt .45s var(--ease) forwards,choisi .45s var(--spring)}
@keyframes choisi{50%{transform:scale(1.02)}}
.opt.sel .rond{background:var(--indigo);border-color:var(--indigo)}
.opt.sel .rond svg{transform:scale(1)}
.opt .vague{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(139,131,255,.35);transform:translate(-50%,-50%) scale(0);animation:vague .6s ease-out forwards;pointer-events:none}
@keyframes vague{to{transform:translate(-50%,-50%) scale(40);opacity:0}}
.question.fige .opt:not(.sel){opacity:.4}
@media (hover:hover){.opt:hover{border-color:rgba(139,131,255,.5);background:rgba(139,131,255,.07)}}

/* ---------- étape finale ---------- */
.final{padding-top:4px}
.final h2{margin-bottom:18px}
.rupture{position:relative;overflow:hidden;border:1px solid rgba(247,147,30,.45);background:linear-gradient(180deg,rgba(247,147,30,.12),rgba(247,147,30,.03));border-radius:var(--r);padding:18px 22px;margin-bottom:22px;animation:mot .7s var(--ease) both .5s}
.rupture::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(247,147,30,.16),transparent 70%);transform:translateX(-100%);animation:balaye 1.4s ease-out 1.1s}
@keyframes balaye{to{transform:translateX(100%)}}
.rupture .k{display:flex;align-items:center;gap:8px;font:800 12px var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:8px}
.rupture .k svg{width:16px;height:16px}
.rupture strong{display:block;font-size:20px;color:var(--blanc);margin-bottom:6px}
.rupture p{color:var(--brume)}
.annonce{text-align:center;color:var(--brume);margin-bottom:20px;animation:mot .7s var(--ease) both .7s}
.annonce b{color:var(--blanc)}
form{display:grid;gap:12px;animation:mot .7s var(--ease) both .85s}
.champ{display:grid;gap:6px}
.champ label{font-size:14px;color:var(--brume)}
.champ input{width:100%;min-height:56px;padding:0 18px;border-radius:14px;border:1px solid var(--ligne);background:rgba(255,255,255,.04);color:var(--blanc);font:16px 'General Sans',system-ui,sans-serif;transition:border-color .2s,box-shadow .2s}
.champ input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(84,74,250,.2)}
.champ small{color:var(--brume-2);font-size:13px}
#suite:not([hidden]){display:grid;gap:12px;animation:mot .5s var(--ease) both}
.err{color:var(--err);font-size:14px;min-height:1px}
.legal{color:var(--brume-2);font-size:13px;text-align:center;margin-top:8px}

/* ---------- calcul ---------- */
.attente{text-align:center;padding:10px 0 20px}
.attente h2{margin-bottom:22px}
.etapes{display:grid;gap:12px;max-width:340px;margin:0 auto;text-align:left}
.etapes div{display:flex;align-items:center;gap:12px;color:var(--brume);opacity:.35;transition:opacity .3s,color .3s}
.etapes div.on{opacity:1;color:var(--blanc)}
.etapes i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid rgba(139,131,255,.4);display:grid;place-items:center;transition:background .3s,border-color .3s}
.etapes i svg{width:13px;height:13px;transform:scale(0);transition:transform .35s var(--spring)}
.etapes div.ok i{background:var(--indigo);border-color:var(--indigo)}
.etapes div.ok i svg{transform:scale(1)}

/* ---------- résultat ---------- */
.res{padding-top:10px}
.res h2{animation:mot .6s var(--ease) both}
.res .jauge{display:grid;place-items:center;margin:10px auto 8px;position:relative;width:236px;height:236px}
.res .jauge svg{position:absolute;inset:0;transform:rotate(-90deg)}
.res .jauge .centre{display:grid;place-items:center;text-align:center}
.res .jauge .val{font-family:var(--display);font-size:68px;line-height:1;color:var(--blanc)}
.res .jauge .val small{font-size:.5em}
.res .jauge .sur{font:800 12px var(--label);color:var(--brume);letter-spacing:.14em;margin-top:8px;max-width:150px}
.bande{text-align:center;font:800 15px var(--label);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:26px;opacity:0;transition:opacity .5s}
.bande.on{opacity:1}
.carte{border:1px solid var(--ligne);background:var(--carte);border-radius:var(--r);padding:22px;margin-bottom:16px}
.carte h3{font:800 13px var(--label);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.radar-res{--h:clamp(170px,46vw,230px);margin-bottom:28px}
.axes{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:14px}
.axes div{display:flex;justify-content:space-between;gap:8px;color:var(--brume)}
.axes b{color:var(--blanc)}
.axes .rupt span,.axes .rupt b{color:var(--orange)}
.priorites{display:grid;gap:12px;margin-top:10px}
.prio{position:relative;border:1px solid var(--ligne);background:var(--carte);border-radius:var(--r);padding:20px 22px;opacity:0;transform:translateY(24px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.prio.vu{opacity:1;transform:none}
.prio.un{border-color:rgba(84,74,250,.7);background:linear-gradient(180deg,rgba(84,74,250,.18),rgba(84,74,250,.05))}
.prio .haut{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.prio .num{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--indigo);color:#fff;font:800 15px var(--label);transform:scale(0);transition:transform .45s var(--spring) .25s}
.prio.vu .num{transform:scale(1)}
.prio h4{font-size:18px;color:var(--blanc);line-height:1.3}
.prio .axe{font:800 11px var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.prio p{color:var(--brume);margin-top:8px}
.prio .geste{color:var(--texte)}
.prio .geste b{color:var(--blanc)}
.prio .preuve-l{color:var(--texte);border-left:3px solid var(--indigo);padding-left:12px;margin-top:12px;font-size:15px}
.objectif{color:var(--texte);text-align:center;margin:18px 0 26px}
.objectif b{color:var(--blanc)}
.appel{text-align:center;border:1px solid rgba(139,131,255,.35);background:radial-gradient(80% 90% at 50% 0%,rgba(84,74,250,.30),transparent 75%),var(--carte);border-radius:20px;padding:30px 22px}
.appel .avatar{position:relative;display:block;width:84px;height:84px;margin:0 auto 16px}
.appel .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 3px rgba(139,131,255,.55),0 14px 40px rgba(84,74,250,.5)}
.appel .avatar::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(139,131,255,.6);animation:halo 2.6s ease-out infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.92)}100%{opacity:0;transform:scale(1.35)}}
.appel h3{font-family:var(--display);font-weight:400;font-size:24px;color:var(--blanc);margin-bottom:10px;line-height:1.15}
.appel p{color:var(--brume);margin-bottom:20px}
.appel .btns{display:grid;gap:10px}
.pied-page{text-align:center;color:var(--brume-2);font-size:13px;margin-top:28px}
.pied-page a{color:var(--brume)}
@media (min-width:700px){.page{padding-top:24px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .mot,.opt,.promesses li,.prio,.bande,.rupture,.annonce,form{opacity:1!important;transform:none!important;filter:none!important}
  .pave{background-size:100% 100%}
}
.vite *,.vite *::before,.vite *::after{animation:none!important;transition:none!important}
.vite .mot,.vite .opt,.vite .promesses li,.vite .prio,.vite .bande,.vite .rupture,.vite .annonce,.vite form{opacity:1!important;transform:none!important;filter:none!important}
.vite .pave{background-size:100% 100%}
@media print{
  body{background:#fff;color:#111}body::before{display:none}
  .page{max-width:none;padding:0}
  .barre,.tableau,.appel .btns,.pied-page{display:none!important}
  h1,h2,.prio h4,.appel h3,.res .jauge .val,.axes b,.prio .geste b{color:#111}
  .carte,.prio,.appel,.rupture{border-color:#ccc;background:#fff;break-inside:avoid;opacity:1;transform:none}
  .prio p,.axes div,.appel p,.res .jauge .sur,.rupture p{color:#444}
  .lab{color:#444;opacity:1}
}
</style>
</head>
<body>
<main class="page">
  <div class="barre" id="barre" hidden>
    <button class="retour" id="retour" type="button" aria-label="Question précédente"></button>
    <div class="segs" id="segs" aria-hidden="true"></div>
    <span class="compteur" id="compteur"></span>
  </div>

<script>

    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    cible: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
    fleche: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  };
  const qs = new URLSearchParams(location.search);
  const APERCU = qs.has('apercu'); // aperçu du Studio : rien n'est envoyé, on peut ouvrir directement un écran
  const calme = matchMedia('(prefers-reduced-motion: reduce)').matches || (APERCU && qs.has('vite'));
  if (APERCU && qs.has('vite')) document.documentElement.classList.add('vite');
  const src = APERCU ? 'apercu' : qs.get('src') || qs.get('utm_source') || document.referrer || 'direct';

  /* ---------- texte : typographie française, gras, mots qui montent ---------- */
  const NB = ' ', FIN = ' ';
  const typo = (s) => String(s ?? '')
    .replace(/[   ]+([?!;])/g, FIN + '$1').replace(/[   ]+:/g, NB + ':')
    .replace(/(\d)[  ]+(%|€)/g, '$1' + NB + '$2').replace(/(\d)[   ](\d{3})(?!\d)/g, '$1' + FIN + '$2');
  const echap = (s) => typo(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const riche = (s) => echap(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const remplir = (s, v) => String(s ?? '').replace(/\{(\w+)\}/g, (m, k) => (k in v ? v[k] : m));
  const mots = (txt, d = 0) => echap(txt).split(' ').filter(Boolean).map((m, i) => `<span class="mot" style="--i:${i};--d:${d}ms">${m}</span>`).join(' ');
  // titre : le mot entre accolades passe en lavande
  function titreHTML(t, d0 = 120) {
    const m = String(t).match(/^(.*?)\{(.+?)\}(.*)$/);
    if (!m) return mots(t, d0);
    let [, avant, hl, apres] = m, ponct = '';
    const p = apres.match(/^\s*([?!:;]+|[,.…]+)(.*)$/);
    if (p) { ponct = (/^[?!:;]/.test(p[1]) ? FIN : '') + p[1]; apres = p[2]; }
    const n0 = avant.split(' ').filter(Boolean).length, n1 = hl.split(' ').length;
    return `${mots(avant, d0)} <span class="nw"><span class="lv">${mots(hl, d0 + n0 * 50)}</span>${ponct ? `<span class="mot" style="--d:${d0 + (n0 + n1) * 50}ms">${echap(ponct)}</span>` : ''}</span> ${mots(apres, d0 + (n0 + n1 + 1) * 50)}`;
  }

  /* ---------- contenu ---------- */
  // les 5 axes dans l'ordre du radar (en partant du haut, sens horaire)
  const ORDRE = ['assurance', 'methode', 'suivi', 'action', 'systeme'];
  const AXES = T.axes, Q = T.questions, PISTES = T.pistes, A = T.accueil, E = T.ecrans;
  const Q_PROFIL = Q.find((q) => q.id === 'profil'), Q_CAP = Q.find((q) => q.id === 'cap');

  /* ---------- état ---------- */
  const S = { choix: {}, lead: {}, envoye: false };
  const $ = (s) => document.querySelector(s);
  const app = $('#app'), barre = $('#barre'), tableau = $('#tableau'), puces = $('#puces');
  $('#retour').innerHTML = ICO.retour;
  $('#retour').addEventListener('click', () => history.back());

  const choisi = (q) => { const k = S.choix[q.id]; return k == null ? undefined : variante(q).options[k]; };
  const estD = () => (choisi(Q_PROFIL) || {}).v === 'dirigeant';
  const variante = (q) => (q.d && estD() ? { ...q, ...q.d } : q);
  const contenu = (a) => (AXES[a].d && estD() ? { ...AXES[a], ...AXES[a].d } : AXES[a]);
  const axeVal = (v) => Math.round(12 + 0.84 * ((v - 1) / 3) * 100);

  // valeurs des axes déjà renseignés (null tant qu'aucune question de l'axe n'a de réponse)
  function axesActuels() {
    const acc = {};
    for (const q of Q) if (q.a) { const o = choisi(q); if (o) (acc[q.a] = acc[q.a] || []).push(o.v); }
    const out = {};
    for (const a of ORDRE) out[a] = acc[a] ? axeVal(acc[a].reduce((s, v) => s + v, 0) / acc[a].length) : null;
    return out;
  }
  function calcul() {
    const axes = axesActuels();
    for (const a of ORDRE) if (axes[a] == null) axes[a] = axeVal(2);
    // indice de 20 (tout repose sur vous) à 92 (votre vente tient sans vous pousser)
    const brut = ORDRE.reduce((s, a) => s + (axes[a] - 12) / 0.84, 0) / ORDRE.length;
    const indice = Math.round(20 + 0.72 * brut);
    const cap = choisi(Q_CAP);
    const poids = (a) => axes[a] - (cap && a === cap.axe ? 25 : 0);
    const priorites = [...ORDRE].sort((a, b) => poids(a) - poids(b)).slice(0, 3);
    const rupture = [...ORDRE].sort((a, b) => axes[a] - axes[b])[0];
    const piste = cap ? cap.piste : estD() ? 'systeme' : 'cadre';
    return { axes, indice, rupture, priorites, piste, cap };
  }
  const bande = (s) => T.bandes[s < 40 ? 0 : s < 60 ? 1 : s < 80 ? 2 : 3];

  /* ---------- le radar ---------- */
  let nRadar = 0;
  function creerRadar(hote) {
    const id = 'r' + ++nRadar, N = ORDRE.length, C = 100, R = 84;
    const ang = (k) => -Math.PI / 2 + (k * 2 * Math.PI) / N;
    const pt = (k, f) => [C + R * f * Math.cos(ang(k)), C + R * f * Math.sin(ang(k))];
    const poly = (fs) => fs.map((f, k) => pt(k, f).map((n) => n.toFixed(1)).join(',')).join(' ');
    const [bx, by] = pt(0, 1), [ex, ey] = [C + R * Math.cos(-Math.PI / 2 + 0.62), C + R * Math.sin(-Math.PI / 2 + 0.62)];
    let g = `<defs><radialGradient id="${id}g"><stop offset="0" stop-color="#8B83FF" stop-opacity=".6"/><stop offset="1" stop-color="#544AFA" stop-opacity=".3"/></radialGradient>
      <filter id="${id}f" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter></defs>`;
    for (const f of [0.25, 0.5, 0.75, 1]) g += `<polygon class="r-grille${f === 1 ? ' bord' : ''}" points="${poly(Array(N).fill(f))}"/>`;
    for (let k = 0; k < N; k++) { const [x, y] = pt(k, 1); g += `<line class="r-rayon" x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }
    g += `<g class="r-balai"><path d="M${C},${C} L${bx.toFixed(1)},${by.toFixed(1)} A${R},${R} 0 0,1 ${ex.toFixed(1)},${ey.toFixed(1)} Z" fill="rgba(139,131,255,.16)"/><line x1="${C}" y1="${C}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#8B83FF" stroke-width="1.5"/></g>`;
    g += `<polygon class="r-halo" filter="url(#${id}f)" points="${poly(Array(N).fill(0))}"/><polygon class="r-forme" fill="url(#${id}g)" points="${poly(Array(N).fill(0))}"/>`;
    g += `<circle class="r-centre" cx="${C}" cy="${C}" r="3.2"/>`;
    for (let k = 0; k < N; k++) g += `<circle class="r-onde" r="4" cx="${C}" cy="${C}"/><circle class="r-pt" r="3.8" cx="${C}" cy="${C}"/>`;
    const ANCRES = ['translate(-50%,-125%)', 'translate(2px,-50%)', 'translate(-12%,20%)', 'translate(-88%,20%)', 'translate(calc(-100% - 2px),-50%)'];
    hote.innerHTML = `<div class="radar-boite"><svg viewBox="0 0 200 200" aria-hidden="true">${g}</svg>${ORDRE.map((a, k) =>
      `<span class="lab" style="--x:${Math.cos(ang(k)).toFixed(3)};--y:${Math.sin(ang(k)).toFixed(3)};transform:${ANCRES[k]}">${echap(AXES[a].nom)}</span>`).join('')}</div>`;
    const svg = hote.querySelector('svg'), forme = svg.querySelector('.r-forme'), halo = svg.querySelector('.r-halo');
    const pts = [...svg.querySelectorAll('.r-pt')], ondes = [...svg.querySelectorAll('.r-onde')], labs = [...hote.querySelectorAll('.lab')];
    let cur = Array(N).fill(0), cible = cur.slice(), raf = 0, demoT = 0;
    const dessiner = (fs) => {
      const p = poly(fs);
      forme.setAttribute('points', p); halo.setAttribute('points', p);
      fs.forEach((f, k) => { const [x, y] = pt(k, f); pts[k].setAttribute('cx', x.toFixed(1)); pts[k].setAttribute('cy', y.toFixed(1)); });
    };
    const ressort = (x) => 1 + 2.55 * Math.pow(x - 1, 3) + 1.55 * Math.pow(x - 1, 2);
    function animer(vers, duree = 900) {
      cancelAnimationFrame(raf);
      cible = vers.slice();
      if (calme) { cur = vers.slice(); dessiner(cur); return; }
      const de = cur.slice(), t0 = performance.now();
      const pas = (t) => {
        const x = Math.min(1, (t - t0) / duree), e = ressort(x);
        cur = de.map((d, k) => d + (vers[k] - d) * e);
        dessiner(cur);
        if (x < 1) raf = requestAnimationFrame(pas);
      };
      raf = requestAnimationFrame(pas);
    }
    const stopDemo = () => { clearTimeout(demoT); demoT = 0; };
    return {
      // vals : { axe: 0..100 ou null } ; les axes qui viennent de changer s'allument et lancent une onde
      maj(vals, { onde = false } = {}) {
        stopDemo();
        const vers = ORDRE.map((a) => (vals[a] == null ? 0 : 0.22 + 0.78 * vals[a] / 100));
        ORDRE.forEach((a, k) => {
          const on = vals[a] != null;
          labs[k].classList.toggle('on', on);
          pts[k].classList.toggle('on', on);
          if (onde && on && Math.abs(vers[k] - cible[k]) > 0.004 && !calme) {
            const [x, y] = pt(k, vers[k]);
            ondes[k].setAttribute('cx', x.toFixed(1)); ondes[k].setAttribute('cy', y.toFixed(1));
            ondes[k].classList.remove('go'); labs[k].classList.remove('flash');
            void labs[k].offsetWidth;
            labs[k].classList.add('flash');
            setTimeout(() => ondes[k].classList.add('go'), 320);
          }
        });
        svg.classList.toggle('vide', vers.every((f) => f === 0));
        if (vers.some((f, k) => Math.abs(f - cible[k]) > 0.004)) animer(vers);
      },
      // accueil : le radar respire entre plusieurs profils
      demo() {
        stopDemo();
        const formes = [[0.78, 0.5, 0.66, 0.38, 0.7], [0.48, 0.84, 0.42, 0.72, 0.55], [0.66, 0.62, 0.84, 0.56, 0.4], [0.55, 0.4, 0.5, 0.86, 0.66]];
        labs.forEach((l) => l.classList.add('on')); pts.forEach((p) => p.classList.add('on'));
        svg.classList.remove('vide');
        let i = 0;
        const tour = () => { animer(formes[i++ % formes.length], 1500); demoT = setTimeout(tour, calme ? 1e9 : 2600); };
        tour();
      },
      scan(on) { svg.classList.toggle('scan', on); },
      rupture(axe) {
        ORDRE.forEach((a, k) => {
          const r = a === axe;
          labs[k].classList.toggle('rupt', r); pts[k].classList.toggle('rupt', r);
          if (r) { ondes[k].setAttribute('cx', pts[k].getAttribute('cx')); ondes[k].setAttribute('cy', pts[k].getAttribute('cy')); }
          ondes[k].classList.toggle('rupt', r);
        });
      },
    };
  }
  const radar = creerRadar($('#radar'));

  // les pastilles sous le radar : le profil, puis le cap
  let pucesAvant = '';
  function majPuces() {
    const p = choisi(Q_PROFIL), cap = choisi(Q_CAP);
    const cle = (p ? p.v : '') + '|' + (cap ? cap.v : '');
    if (cle === pucesAvant) return;
    const [p0, c0] = pucesAvant.split('|');
    pucesAvant = cle;
    if (!p && !cap) { puces.innerHTML = `<span class="aide">${echap(E.radar_aide)}</span>`; return; }
    puces.innerHTML = (p ? `<span class="puce${p.v !== p0 ? ' neuf' : ''}"><i>${echap(E.puce_profil)}</i>${echap(p.court)}</span>` : '')
      + (cap ? `<span class="puce${cap.v !== c0 ? ' neuf' : ''}"><i>${echap(E.puce_cap)}</i>${echap(cap.court)}</span>` : '');
  }
  function modeTableau(m) {
    tableau.hidden = !m;
    if (m) tableau.dataset.mode = m;
  }
  function majBarre(i, texte) {
    barre.hidden = false;
    const segs = $('#segs');
    if (segs.children.length !== Q.length) segs.innerHTML = Q.map(() => '<i></i>').join('');
    [...segs.children].forEach((s, k) => s.classList.toggle('fait', k < i));
    setTimeout(() => [...segs.children].forEach((s, k) => s.classList.toggle('fait', k <= i)), 120);
    $('#compteur').textContent = texte;
  }

  /* ---------- navigation (bouton retour du navigateur compris) ---------- */
  function aller(etat, remplacer) {
    const url = location.search + '#' + etat.e + (etat.i != null ? etat.i + 1 : '');
    if (remplacer) history.replaceState(etat, '', url); else history.pushState(etat, '', url);
    const ecran = app.querySelector('.ecran');
    if (ecran && !calme && !remplacer) { ecran.classList.add('sort'); setTimeout(() => rendre(etat), 220); }
    else rendre(etat);
  }
  addEventListener('popstate', (ev) => rendre(ev.state || { e: 'accueil' }));

  function rendre(etat) {
    scrollTo({ top: 0 });
    if (etat.e === 'q' && etat.i > 0 && S.choix[Q[etat.i - 1].id] === undefined) etat = { e: 'q', i: 0 };
    if ((etat.e === 'final' || etat.e === 'resultat') && S.choix[Q_CAP.id] === undefined) etat = { e: 'accueil' };
    if (etat.e === 'resultat' && !S.envoye) etat = { e: 'final' };
    radar.scan(false);
    if (etat.e === 'accueil') return accueil();
    if (etat.e === 'q') return question(etat.i);
    if (etat.e === 'final') return final();
    return resultat();
  }

  /* ---------- accueil ---------- */
  function accueil() {
    barre.hidden = true;
    modeTableau('intro');
    radar.rupture(null);
    radar.demo();
    const n = A.promesses.length;
    app.innerHTML = `<section class="ecran intro">
      <span class="pilule">${echap(A.pilule)}</span>
      <h1>${mots(A.titre, 250)}<span class="h1b">${mots(A.titre2, 700)} <span class="pave" style="--d:1150ms">${mots(A.pave, 820)}</span>${echap(A.titre_fin)}</span></h1>
      <p class="mal">${riche(A.mal)}</p>
      <p class="bascule">${riche(A.bascule)}</p>
      <ol class="promesses">
        ${A.promesses.map((p, k) => `<li style="--i:${k}"><span class="n">${k + 1}</span><span>${riche(p)}</span></li>`).join('')}
        <li style="--i:${n}" class="pied">${riche(remplir(A.pied, { n: Q.length }))}</li>
      </ol>
      <button class="btn" id="go" type="button">${echap(A.bouton)} ${ICO.fleche}</button>
      <p class="sous-btn">${riche(A.sous_bouton)}</p>
      <div class="preuve"><img src="${PHOTO}" alt="" width="46" height="46"><span>${riche(A.preuve)}</span></div>
    </section>`;
    $('#go').addEventListener('click', () => aller({ e: 'q', i: 0 }));
  }

  /* ---------- questions ---------- */
  function question(i) {
    const q = variante(Q[i]), dejaK = S.choix[q.id];
    majBarre(i, `${i + 1} / ${Q.length}`);
    modeTableau('quiz');
    radar.rupture(null);
    radar.maj(axesActuels());
    majPuces();
    app.innerHTML = `<section class="ecran question">
      <span class="etiq">${echap(q.theme)}</span>
      <h2>${titreHTML(q.titre)}</h2>
      <div class="options" role="group" aria-label="${echap(q.titre.replace(/[{}]/g, ''))}">
        ${q.options.map((o, k) => `<button class="opt${dejaK === k ? ' sel' : ''}" type="button" data-k="${k}" style="animation-delay:${320 + k * 65}ms"><span class="rond">${ICO.ok}</span><span>${echap(o.t)}</span></button>`).join('')}
      </div>
    </section>`;
    app.querySelectorAll('.opt').forEach((b) => b.addEventListener('click', (ev) => {
      if (app.querySelector('.question.fige')) return;
      S.choix[q.id] = +b.dataset.k;
      const box = b.getBoundingClientRect(), v = document.createElement('span');
      v.className = 'vague';
      v.style.left = (ev.clientX ? ev.clientX - box.left : box.width / 2) + 'px';
      v.style.top = (ev.clientY ? ev.clientY - box.top : box.height / 2) + 'px';
      b.append(v);
      app.querySelectorAll('.opt.sel').forEach((x) => x !== b && x.classList.remove('sel'));
      b.classList.add('sel');
      app.querySelector('.question').classList.add('fige');
      // le radar se dessine tout de suite, la question suivante arrive pendant qu'il bouge
      radar.maj(axesActuels(), { onde: true });
      majPuces();
      setTimeout(() => aller(i + 1 < Q.length ? { e: 'q', i: i + 1 } : { e: 'final' }), calme ? 250 : 620);
    }));
  }

  /* ---------- étape finale ---------- */
  function final() {
    const c = calcul(), ax = contenu(c.rupture);
    majBarre(Q.length, E.presque_fini);
    modeTableau('final');
    radar.maj(c.axes);
    majPuces();
    setTimeout(() => { if (app.querySelector('.final')) radar.rupture(c.rupture); }, calme ? 0 : 700);
    app.innerHTML = `<section class="ecran final">
      <span class="etiq">${echap(E.final_etiquette)}</span>
      <h2>${titreHTML(E.final_titre, 120)}</h2>
      <div class="rupture">
        <div class="k">${ICO.cible}${echap(E.rupture_label)}</div>
        <strong>${echap(ax.nom)}</strong>
        <p>${echap(ax.rupture)}</p>
      </div>
      <p class="annonce">${riche(E.final_annonce)}</p>
      <form id="form" novalidate>
        <div class="champ"><label for="prenom">${echap(E.champ_prenom)}</label><input id="prenom" name="prenom" autocomplete="given-name" required value="${echap(S.lead.prenom || '')}"></div>
        <div id="suite" hidden>
          <div class="champ"><label for="email">${echap(E.champ_email)}</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required value="${echap(S.lead.email || '')}"></div>
          <div class="champ"><label for="tel">${echap(E.champ_tel)}</label><input id="tel" name="tel" type="tel" autocomplete="tel" inputmode="tel" value="${echap(S.lead.tel || '')}"><small>${echap(E.tel_aide)}</small></div>
        </div>
        <p class="err" id="err" role="alert"></p>
        <button class="btn plein" id="envoi" type="submit">${echap(E.bouton_continuer)} ${ICO.fleche}</button>
      </form>
      <p class="legal">${echap(E.legal)} <a href="../confidentialite.html">${echap(E.lien_confidentialite)}</a></p>
    </section>`;
    const f = $('#form'), suite = $('#suite'), err = $('#err'), btn = $('#envoi'), prenom = $('#prenom');
    let etape = 1;
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      err.textContent = '';
      const p = prenom.value.trim();
      if (!p) { err.textContent = typo(E.err_prenom); prenom.focus(); return; }
      S.lead.prenom = p;
      if (etape === 1) {
        etape = 2;
        suite.hidden = false;
        btn.innerHTML = `${echap(E.bouton_resultat)} ${ICO.fleche}`;
        $('#email').focus();
        return;
      }
      const em = $('#email').value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { err.textContent = typo(E.err_email); $('#email').focus(); return; }
      S.lead.email = em;
      S.lead.tel = $('#tel').value.trim();
      envoyer(c);
      S.envoye = true;
      attente();
    });
  }

  function envoyer(c) {
    const prof = choisi(Q_PROFIL);
    const corps = {
      prenom: S.lead.prenom, email: S.lead.email, tel: S.lead.tel,
      profil: prof ? prof.v : '', score: c.indice, rupture: AXES[c.rupture].nom,
      objectif: c.cap ? c.cap.court : '', piste: PISTES[c.piste].note,
      axes: c.axes, top: c.priorites.map((a) => AXES[a].nom),
      reponses: { ...Object.fromEntries(Q.map((q) => [q.id, (choisi(q) || {}).t || ''])), piste: c.piste },
      source: 'pilote-auto · ' + src,
    };
    if (APERCU) { console.info('Aperçu du Studio : rien n\'est envoyé', corps); return; }
    const essai = (n) => fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corps), keepalive: true })
      .then((r) => { if (!r.ok && n < 2) setTimeout(() => essai(n + 1), 1500); })
      .catch(() => { if (n < 2) setTimeout(() => essai(n + 1), 1500); });
    essai(0);
  }

  /* ---------- calcul ---------- */
  function attente() {
    barre.hidden = true;
    modeTableau('calcul');
    radar.rupture(null);
    radar.scan(true);
    app.innerHTML = `<section class="ecran attente"><h2>${echap(E.calcul_titre)}</h2>
      <div class="etapes">${E.calcul_etapes.map((t) => `<div><i>${ICO.ok}</i><span>${echap(remplir(t, { n: Q.length }))}</span></div>`).join('')}</div></section>`;
    app.querySelectorAll('.etapes div').forEach((l, k) => {
      setTimeout(() => l.classList.add('on'), 250 + k * 800);
      setTimeout(() => l.classList.add('ok'), 800 + k * 800);
    });
    setTimeout(() => aller({ e: 'resultat' }, true), calme ? 600 : 3000);
  }

  /* ---------- résultat ---------- */
  function resultat() {
    barre.hidden = true;
    modeTableau(null);
    const c = calcul(), prof = choisi(Q_PROFIL), piste = PISTES[c.piste];
    const prios = c.priorites.map((a, k) => {
      const ax = contenu(a);
      return `<article class="prio${k === 0 ? ' un' : ''}"><div class="haut"><span class="num">${k + 1}</span><div><span class="axe">${echap(ax.nom)} · ${c.axes[a]}/100</span><h4>${echap(ax.titre)}</h4></div></div>
        <p class="geste"><b>${echap(E.res_geste)}</b> ${echap(ax.geste)}</p><p>${echap(ax.suite)}</p><p class="preuve-l">${echap(ax.preuve)}</p></article>`;
    }).join('');
    const notes = `Pilote automatique ${c.indice} % · profil : ${prof ? prof.court : '?'} · point de rupture : ${AXES[c.rupture].nom} · priorités : ${c.priorites.map((a) => AXES[a].nom).join(', ')}${c.cap ? ' · cap : ' + c.cap.court : ''} · ${piste.note}`;
    const cal = `${CAL}?name=${encodeURIComponent(S.lead.prenom || '')}&email=${encodeURIComponent(S.lead.email || '')}&notes=${encodeURIComponent(notes)}`;
    const C = 2 * Math.PI * 100;
    app.innerHTML = `<section class="ecran res">
      <span class="etiq">${echap(E.res_etiquette)}</span>
      <h2>${echap(S.lead.prenom ? remplir(E.res_titre, { prenom: S.lead.prenom }) : E.res_titre_sans)}</h2>
      <div class="jauge" aria-label="${echap(E.res_jauge)} : ${c.indice} %">
        <svg viewBox="0 0 236 236" aria-hidden="true"><circle cx="118" cy="118" r="100" fill="none" stroke="rgba(139,131,255,.16)" stroke-width="14"/><circle id="arc" cx="118" cy="118" r="100" fill="none" stroke="url(#dg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.7s cubic-bezier(.22,1,.36,1)"/><defs><linearGradient id="dg" x1="0" x2="1"><stop offset="0" stop-color="#4747FD"/><stop offset="1" stop-color="#8B83FF"/></linearGradient></defs></svg>
        <div class="centre"><span class="val"><span id="val">0</span><small>${NB}%</small></span><span class="sur">${echap(E.res_jauge)}</span></div>
      </div>
      <p class="bande" id="bande">${echap(bande(c.indice))}</p>
      <div class="carte"><h3>${echap(E.res_profil)}</h3><div class="radar-res" id="radar-res"></div>
        <div class="axes">${ORDRE.map((a) => `<div${a === c.rupture ? ' class="rupt"' : ''}><span>${echap(AXES[a].nom)}</span><b>${c.axes[a]}</b></div>`).join('')}</div></div>
      <div class="rupture"><div class="k">${ICO.cible}${echap(E.rupture_label)}</div><strong>${echap(AXES[c.rupture].nom)}</strong><p>${echap(contenu(c.rupture).rupture)}</p></div>
      <div class="carte"><h3>${echap(E.res_priorites)}</h3><div class="priorites">${prios}</div></div>
      ${c.cap ? `<p class="objectif">${riche(remplir(E.res_cap, { cap: c.cap.court }))}</p>` : ''}
      <div class="appel">
        <span class="avatar"><img src="${PHOTO}" alt="Steven Lefrançois" width="84" height="84"></span>
        <h3>${echap(piste.h)}</h3>
        <p>${echap(piste.p)}</p>
        <div class="btns"><a class="btn plein" href="${cal}" target="_blank" rel="noopener">${echap(E.res_bouton_appel)} ${ICO.fleche}</a><button class="btn second plein" id="pdf" type="button">${echap(E.res_bouton_pdf)}</button></div>
      </div>
      <p class="pied-page">Persua · Steven Lefrançois · <a href="../confidentialite.html">${echap(E.lien_confidentialite)}</a></p>
    </section>`;
    $('#pdf').addEventListener('click', () => print());
    const radarRes = creerRadar($('#radar-res'));
    const arc = $('#arc'), val = $('#val');
    const duree = calme ? 0 : 1600;
    setTimeout(() => {
      arc.style.strokeDashoffset = String(C * (1 - c.indice / 100));
      const t0 = performance.now();
      const pas = (t) => {
        const k = duree ? Math.min(1, (t - t0) / duree) : 1;
        val.textContent = String(Math.round(c.indice * (1 - Math.pow(1 - k, 3))));
        if (k < 1) requestAnimationFrame(pas);
        else $('#bande').classList.add('on');
      };
      requestAnimationFrame(pas);
    }, 250);
    // radar et priorités : animés quand ils arrivent à l'écran
    const io = new IntersectionObserver((entrees) => entrees.forEach((e) => {
      if (!e.isIntersecting) return;
      if (e.target.id === 'radar-res') { radarRes.maj(c.axes, { onde: true }); setTimeout(() => radarRes.rupture(c.rupture), calme ? 0 : 900); }
      else e.target.classList.add('vu');
      io.unobserve(e.target);
    }), { threshold: 0.25 });
    io.observe($('#radar-res'));
    app.querySelectorAll('.prio').forEach((n, k) => { n.style.transitionDelay = (k % 3) * 120 + 'ms'; io.observe(n); });
  }

  /* ---------- démarrage ---------- */
  // Aperçu du Studio : ?apercu&ecran=q3|final|calcul|resultat&profil=2 ouvre directement l'écran, réponses pré-remplies
  const ecranDemande = APERCU ? qs.get('ecran') : null;
  if (ecranDemande && ecranDemande !== 'accueil') {
    const p0 = Math.min(Q_PROFIL.options.length - 1, Math.max(0, +(qs.get('profil') || 0)));
    const parcours = [p0, 1, 2, 2, 3, 1, 3, 2, 0];
    const jusque = (n) => Q.slice(0, n).forEach((q, k) => { S.choix[q.id] = q === Q_PROFIL ? p0 : Math.min(parcours[k] ?? 0, variante(q).options.length - 1); });
    const m = ecranDemande.match(/^q(\d+)$/);
    let etat = { e: 'final' };
    if (m) { const i = Math.min(Q.length, Math.max(1, +m[1])) - 1; jusque(i); etat = { e: 'q', i }; }
    else { jusque(Q.length); if (ecranDemande !== 'final') { S.lead.prenom = 'Prénom'; S.envoye = true; etat = { e: 'resultat' }; } }
    history.replaceState(etat, '', location.search);
    if (ecranDemande === 'calcul') attente(); else rendre(etat);
  } else {
    rendre({ e: 'accueil' });
    history.replaceState({ e: 'accueil' }, '', location.search);
  }
})();
</script>
</body>
</html>
